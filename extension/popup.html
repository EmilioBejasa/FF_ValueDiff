/* ---------------- stats ---------------- */

// A 12-team, 20-round draft runs 240 picks — call it 250 to round up.
// Beyond that, a platform's number isn't really "when this player gets
// drafted," it's that platform's filler/default value for someone who
// wouldn't realistically get drafted in a normal league (ESPN in particular
// falls back to values like 999+ for these). Those values are still shown
// (never hidden — every cell traces to its real source), just excluded from
// the Consensus average and from deviation coloring so one platform's
// filler number can't drag the whole row's math around.
const DRAFT_POOL_SIZE = 250;
function inDraftPool(v) {
  return v != null && v <= DRAFT_POOL_SIZE;
}

function mean(values) {
  return values.reduce((a, b) => a + b, 0) / values.length;
}

// A platform's cell is flagged only when it deviates *meaningfully* from
// the consensus average, not just whichever platform happens to be the
// literal min/max — the threshold scales with the pick itself (15%) but
// never drops below 3 picks, since top-of-draft ADPs sit within a few
// tenths of each other and would otherwise look "significant" for noise.
function deviationThreshold(avg) {
  return Math.max(3, avg * 0.15);
}

// posRank ("RB1", "WR12", ...) is derived from each player's own Consensus
// average, not scraped from anywhere — so it updates automatically whenever
// Consensus does (e.g. after background.js's next refresh), with no extra
// data source needed.
function computeStats(players) {
  const withAvg = players.map((p) => {
    const entries = PLATFORMS.map((pl) => [pl.key, p.adp[pl.key]]).filter(([, v]) => inDraftPool(v));
    const values = entries.map(([, v]) => v);
    const avg = values.length ? mean(values) : null;
    const deviation = {};
    if (avg != null) {
      const threshold = deviationThreshold(avg);
      entries.forEach(([k, v]) => {
        const diff = v - avg;
        deviation[k] = diff >= threshold ? "high" : diff <= -threshold ? "low" : "neutral";
      });
    }
    return { ...p, avg, deviation };
  });

  const posRankByPosition = {};
  withAvg.forEach((p) => {
    (posRankByPosition[p.position] ||= []).push(p);
  });
  const posRankById = {};
  Object.values(posRankByPosition).forEach((group) => {
    group
      .slice()
      .sort((a, b) => (a.avg == null) - (b.avg == null) || (a.avg ?? 0) - (b.avg ?? 0))
      .forEach((p, i) => { posRankById[p.id] = p.avg == null ? null : i + 1; });
  });

  return withAvg.map((p) => ({ ...p, posRank: posRankById[p.id] }));
}

/* ---------------- pairwise diff buckets (for the chart) ---------------- */

const NEUTRAL_BAND = 3; // picks

function bucketFor(diff) {
  if (diff > NEUTRAL_BAND) return "aEarlier";
  if (diff < -NEUTRAL_BAND) return "bEarlier";
  return "neutral";
}

const BUCKET_COLOR = {
  aEarlier: "var(--series-red)",
  bEarlier: "var(--series-blue)",
  neutral: "var(--series-neutral)",
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------------- value chart (hand-rolled SVG scatter) ---------------- */
// x = platform A's ADP, y = platform B's ADP. The diagonal is "A and B
// agree"; below it, A drafts him earlier than B; above it, B drafts him
// earlier than A.

const CHART_W = 640;
const CHART_H = 380;
const MARGIN = { top: 16, right: 20, bottom: 40, left: 44 };

function niceTicks(min, max, maxCount) {
  const range = max - min || 1;
  const rawStep = range / maxCount;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  const step = (norm > 5 ? 10 : norm > 2 ? 5 : norm > 1 ? 2 : 1) * mag;
  const ticks = [];
  for (let t = Math.ceil(min / step) * step; t <= max; t += step) ticks.push(Math.round(t * 10) / 10);
  return ticks;
}

function renderChart(container, players, platformA, platformB) {
  const labelA = PLATFORM_LABEL[platformA];
  const labelB = PLATFORM_LABEL[platformB];

  // FantasyPros isn't a real draft room, it's an aggregated expert-consensus
  // ranking (see the table's † note) — so "later than the other platform"
  // means experts rate him worse than the market does (fade, red), not that
  // he's a bargain (buy, blue) the way it would for two real markets. Only
  // platformA needs a flip: when B is FantasyPros the raw bucketFor(b - a)
  // sign already lands on the right color, verified by hand for both cases.
  const invertA = !!PLATFORMS.find((pl) => pl.key === platformA)?.invertSignal;
  const involvesFantasyPros = platformA === "fantasypros" || platformB === "fantasypros";
  function colorFor(diff) {
    return BUCKET_COLOR[bucketFor(invertA ? -diff : diff)];
  }

  const pts = players
    .map((p) => ({ p, a: p.adp[platformA], b: p.adp[platformB] }))
    .filter((d) => inDraftPool(d.a) && inDraftPool(d.b));

  if (pts.length === 0) {
    container.innerHTML = `
      <div class="rounded-lg border p-8 text-center text-sm" style="border-color: var(--border); color: var(--text-muted);">
        No players have both ${escapeHtml(labelA)} and ${escapeHtml(labelB)} ADP within a normal draft's range in the current filter.
      </div>`;
    return;
  }

  const allValues = pts.flatMap((d) => [d.a, d.b]);
  const axisMin = 1;
  const axisMax = Math.max(...allValues) * 1.05;
  const plotW = CHART_W - MARGIN.left - MARGIN.right;
  const plotH = CHART_H - MARGIN.top - MARGIN.bottom;
  const sx = (v) => MARGIN.left + ((v - axisMin) / (axisMax - axisMin)) * plotW;
  const sy = (v) => MARGIN.top + plotH - ((v - axisMin) / (axisMax - axisMin)) * plotH;
  const ticks = niceTicks(axisMin, axisMax, 6);

  const buckets = ["aEarlier", "neutral", "bEarlier"];
  const bucketLabel = {
    aEarlier: `${labelA} earlier`,
    bEarlier: `${labelB} earlier`,
    neutral: "In agreement",
  };

  const legendHtml = buckets
    .map((b) => {
      const color = b === "neutral" ? BUCKET_COLOR.neutral : colorFor(b === "aEarlier" ? 1 : -1);
      return `<span class="flex items-center gap-1.5 text-xs" style="color: var(--text-secondary);">
        <span class="inline-block rounded-full" style="width:8px;height:8px;background:${color};"></span>
        ${escapeHtml(bucketLabel[b])}
      </span>`;
    })
    .join("");

  const gridLines = ticks.map((t) => `<line x1="${MARGIN.left}" x2="${CHART_W - MARGIN.right}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--grid)" stroke-width="1" />`).join("");
  const yLabels = ticks.map((t) => `<text x="${MARGIN.left - 8}" y="${sy(t)}" dy="0.32em" text-anchor="end" font-size="10" fill="var(--text-muted)">${t}</text>`).join("");
  const xLabels = ticks.map((t) => `<text x="${sx(t)}" y="${CHART_H - MARGIN.bottom + 16}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${t}</text>`).join("");
  const circles = pts.map(({ a, b }, i) => `<circle data-idx="${i}" cx="${sx(a)}" cy="${sy(b)}" r="5" fill="${colorFor(b - a)}" stroke="var(--surface-1)" stroke-width="2" style="cursor:pointer;" />`).join("");

  container.innerHTML = `
    <div class="rounded-lg border p-4" style="border-color: var(--border); background: var(--surface-1);">
      <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
        <h2 class="text-sm font-semibold" style="color: var(--text-primary);">${escapeHtml(labelA)} ADP vs. ${escapeHtml(labelB)} ADP</h2>
        <div class="flex items-center gap-4 flex-wrap">${legendHtml}</div>
      </div>
      <div class="relative w-full chart-wrap">
        <svg viewBox="0 0 ${CHART_W} ${CHART_H}" class="w-full h-auto">
          ${gridLines}${yLabels}${xLabels}
          <text x="${MARGIN.left + plotW / 2}" y="${CHART_H - 6}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${escapeHtml(labelA)} ADP (1 = drafted first)</text>
          <text x="12" y="${MARGIN.top + plotH / 2}" text-anchor="middle" font-size="11" fill="var(--text-muted)" transform="rotate(-90 12 ${MARGIN.top + plotH / 2})">${escapeHtml(labelB)} ADP (1 = drafted first)</text>
          <line x1="${sx(axisMin)}" y1="${sy(axisMin)}" x2="${sx(axisMax)}" y2="${sy(axisMax)}" stroke="var(--baseline)" stroke-width="1" />
          ${circles}
        </svg>
        <div class="chart-tooltip absolute rounded-md border px-3 py-2 text-xs shadow-sm pointer-events-none" style="display:none; background: var(--surface-1); border-color: var(--border); color: var(--text-primary); width:180px;"></div>
      </div>
      ${
        involvesFantasyPros
          ? `<p class="text-xs mt-3" style="color: var(--text-muted);">† FantasyPros is an aggregated expert-consensus ranking, not a real draft room, so its colors run the opposite way from a real platform: FantasyPros earlier than ${escapeHtml(platformA === "fantasypros" ? labelB : labelA)} is a buy signal (blue); later is a fade signal (red).</p>`
          : ""
      }
    </div>`;

  const wrap = container.querySelector(".chart-wrap");
  const tooltip = container.querySelector(".chart-tooltip");
  wrap.querySelectorAll("circle").forEach((circle) => {
    const idx = Number(circle.getAttribute("data-idx"));
    const { p, a, b } = pts[idx];
    function show(e) {
      const rect = wrap.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const diff = b - a;
      tooltip.style.display = "block";
      tooltip.style.left = Math.min(x + 12, rect.width - 190) + "px";
      tooltip.style.top = Math.max(y - 70, 0) + "px";
      tooltip.innerHTML = `
        <div class="font-semibold mb-1">${escapeHtml(p.name)} <span style="color: var(--text-muted);">· ${escapeHtml(p.position)} · ${escapeHtml(p.team)}</span></div>
        <div style="color: var(--text-secondary);">${escapeHtml(labelA)}: ${a.toFixed(1)}</div>
        <div style="color: var(--text-secondary);">${escapeHtml(labelB)}: ${b.toFixed(1)}</div>
        <div class="mt-1 font-medium" style="color: ${colorFor(diff)};">${diff > 0 ? "+" : ""}${diff.toFixed(1)} picks · ${escapeHtml(bucketLabel[bucketFor(diff)])}</div>
      `;
    }
    circle.addEventListener("mouseenter", show);
    circle.addEventListener("mousemove", show);
    circle.addEventListener("mouseleave", () => {
      tooltip.style.display = "none";
    });
  });
}

/* ---------------- board table ---------------- */

function renderTable(container, players, state, onSort) {
  const sorted = [...players].sort((a, b) => {
    let cmp;
    if (state.sortKey === "name") cmp = a.name.localeCompare(b.name);
    else {
      const av = a[state.sortKey],
        bv = b[state.sortKey];
      if (av == null && bv == null) cmp = 0;
      else if (av == null) cmp = 1;
      else if (bv == null) cmp = -1;
      else cmp = av - bv;
    }
    return state.sortDesc ? -cmp : cmp;
  });

  function headerButtonHtml(key, label) {
    const active = state.sortKey === key;
    const arrow = active ? (state.sortDesc ? "↓" : "↑") : "";
    return `<button type="button" data-sort="${key}" class="flex items-center gap-1 text-xs font-semibold ml-auto" style="color: ${active ? "var(--text-primary)" : "var(--text-muted)"};">${escapeHtml(label)}${arrow ? `<span>${arrow}</span>` : ""}</button>`;
  }

  const platformHeaders = PLATFORMS.map(
    (pl) => `
    <th class="px-2 py-2 text-right" title="${escapeHtml(pl.stale ? pl.staleNote : pl.invertSignal ? "Colors are inverted for this column — see note below the table." : "")}">
      ${headerButtonHtml(pl.key, pl.label)}${pl.invertSignal ? `<span style="color: var(--text-muted);">&nbsp;†</span>` : ""}${pl.stale ? `<span style="color: var(--text-muted);">&nbsp;⏸</span>` : ""}
    </th>`
  ).join("");

  const rows = sorted
    .map((p) => {
      const platformCells = PLATFORMS.map((pl) => {
        const value = p.adp[pl.key];
        const outOfPool = value != null && !inDraftPool(value);
        let status = p.deviation[pl.key];
        if (pl.invertSignal) status = status === "high" ? "low" : status === "low" ? "high" : status;
        const color = value == null || outOfPool ? "var(--text-muted)" : status === "high" ? "var(--series-blue)" : status === "low" ? "var(--series-red)" : "var(--text-primary)";
        const title = outOfPool ? ` title="Outside a normal ${DRAFT_POOL_SIZE}-pick draft — excluded from Consensus and coloring"` : "";
        return `<td class="px-2 py-1.5 text-right font-medium" style="color:${color};"${title}>${value != null ? value.toFixed(1) : "–"}</td>`;
      }).join("");

      return `<tr class="border-b row-hover" style="border-color: var(--border);">
        <td class="px-3 py-1.5 sticky left-0" style="background: var(--surface-1);">
          <div class="font-medium" style="color: var(--text-primary);">${escapeHtml(p.name)}</div>
          <div class="text-xs" style="color: var(--text-muted);">${escapeHtml(p.position)}${p.posRank != null ? p.posRank : ""} · ${escapeHtml(p.team)}</div>
        </td>
        <td class="px-3 py-1.5 text-right font-semibold" style="color: var(--text-primary);">${p.avg != null ? p.avg.toFixed(1) : "–"}</td>
        ${platformCells}
      </tr>`;
    })
    .join("");

  container.innerHTML = `
    <div class="rounded-lg border overflow-x-auto" style="border-color: var(--border); background: var(--surface-1);">
      <table class="w-full border-collapse text-sm">
        <thead>
          <tr class="border-b" style="border-color: var(--border);">
            <th class="text-left px-3 py-2 sticky left-0" style="background: var(--surface-1);">
              <button type="button" data-sort="name" class="flex items-center gap-1 text-xs font-semibold" style="color: ${state.sortKey === "name" ? "var(--text-primary)" : "var(--text-muted)"};">
                Player${state.sortKey === "name" ? `<span>${state.sortDesc ? "↓" : "↑"}</span>` : ""}
              </button>
            </th>
            <th class="px-3 py-2 text-right">${headerButtonHtml("avg", "Consensus")}</th>
            ${platformHeaders}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="text-xs mt-2" style="color: var(--text-muted);">
      † FantasyPros' colors run the other way from Yahoo/ESPN/Sleeper: those three are real drafting
      markets, so sitting well above consensus means real drafters are letting him slide — a buy signal
      (blue). FantasyPros is an aggregated expert-consensus ranking, not a draft room, so the same
      "above consensus" reading there means experts rate him worse than the market does — a fade signal
      (red) instead.
    </p>
    <p class="text-xs mt-2" style="color: var(--text-muted);">
      ⏸ Yahoo is frozen at its last known ADP — BeatADP, this tool's data source, stopped maintaining Yahoo
      numbers on ${escapeHtml(PLATFORMS.find((p) => p.key === "yahoo").staleSince)}, so there's no live number
      left to pull. Sleeper, ESPN, and FantasyPros refresh normally.
    </p>`;

  container.querySelectorAll("[data-sort]").forEach((btn) => {
    btn.addEventListener("click", () => onSort(btn.getAttribute("data-sort")));
  });
}

/* ---------------- app ---------------- */

const POSITIONS = ["ALL", "QB", "RB", "WR", "TE"];

const state = {
  positionFilter: "ALL",
  platformA: "yahoo",
  platformB: "espn",
  sortKey: "avg",
  sortDesc: false,
  players: samplePlayers,
  refreshedAt: null,
  refreshError: null,
  refreshing: false,
};

function getFiltered() {
  const scored = computeStats(state.players);
  return state.positionFilter === "ALL" ? scored : scored.filter((p) => p.position === state.positionFilter);
}

function relativeTime(ms) {
  if (ms == null) return null;
  const mins = Math.round((Date.now() - ms) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  return `${Math.round(hours / 24)}d ago`;
}

function update() {
  const filtered = getFiltered();
  renderChart(document.getElementById("chart"), filtered, state.platformA, state.platformB);
  renderTable(document.getElementById("table"), filtered, state, (key) => {
    if (state.sortKey === key) state.sortDesc = !state.sortDesc;
    else {
      state.sortKey = key;
      state.sortDesc = key !== "name";
    }
    update();
  });
}

function renderPlatformOptions(select, excludeKey) {
  select.innerHTML = PLATFORMS.filter((pl) => pl.key !== excludeKey)
    .map((pl) => `<option value="${pl.key}">${escapeHtml(pl.label)}${pl.stale ? " (frozen)" : ""}</option>`)
    .join("");
}

function buildFilterButtons() {
  const filterContainer = document.getElementById("position-filters");
  filterContainer.querySelectorAll("[data-pos]").forEach((btn) => {
    const pos = btn.getAttribute("data-pos");
    const active = pos === state.positionFilter;
    btn.style.background = active ? "var(--series-blue)" : "transparent";
    btn.style.color = active ? "#ffffff" : "var(--text-secondary)";
  });
}

function buildApp() {
  const root = document.getElementById("app");
  root.innerHTML = `
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col gap-5">
      <header>
        <h1 class="text-xl font-semibold" style="color: var(--text-primary);">FF ValueDiff</h1>
        <p class="text-sm mt-1" style="color: var(--text-secondary);">
          Compares each player's Average Draft Position across Yahoo, ESPN, Sleeper, and FantasyPros'
          consensus, so you can catch cases where platforms disagree on when a player actually gets drafted.
        </p>
        <p class="text-xs mt-1" style="color: var(--text-muted);">
          Real 2026 redraft ADP for the top 200 overall players. Sleeper, ESPN, and FantasyPros refresh
          automatically from BeatADP every 6 hours. Yahoo is frozen at its last known value
          (${escapeHtml(PLATFORMS.find((p) => p.key === "yahoo").staleSince)}) since BeatADP stopped
          maintaining it. ESPN's ADP is that platform's native full-PPR format; Yahoo, Sleeper, and
          FantasyPros are each shown in their own native half-PPR format. Every cell here is read-only,
          matching its source exactly.
        </p>
        <p class="text-xs mt-1 flex items-center gap-2" style="color: var(--text-muted);">
          <span id="refresh-status"></span>
          <button type="button" id="refresh-now" class="text-xs underline">Refresh now</button>
        </p>
      </header>

      <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="flex items-center gap-1" id="position-filters"></div>
        <div class="flex items-center gap-3 flex-wrap">
          <label class="flex items-center gap-2 text-xs">
            <span style="color: var(--text-secondary);">Compare</span>
            <select id="platform-a" class="rounded border px-2 py-1 text-sm outline-none" style="border-color: var(--border); background: var(--page); color: var(--text-primary);"></select>
          </label>
          <span class="text-xs" style="color: var(--text-muted);">vs.</span>
          <select id="platform-b" class="rounded border px-2 py-1 text-sm outline-none" style="border-color: var(--border); background: var(--page); color: var(--text-primary);"></select>
        </div>
      </div>

      <div id="chart"></div>
      <div id="table"></div>
    </div>`;

  const filterContainer = document.getElementById("position-filters");
  filterContainer.innerHTML = POSITIONS.map(
    (pos) => `
    <button type="button" data-pos="${pos}" class="rounded-full px-3 py-1 text-xs font-medium border" style="border-color: var(--border); background: ${pos === state.positionFilter ? "var(--series-blue)" : "transparent"}; color: ${pos === state.positionFilter ? "#ffffff" : "var(--text-secondary)"};">${pos}</button>
  `
  ).join("");
  filterContainer.querySelectorAll("[data-pos]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.positionFilter = btn.getAttribute("data-pos");
      buildFilterButtons();
      update();
    });
  });

  const selectA = document.getElementById("platform-a");
  const selectB = document.getElementById("platform-b");
  function syncSelects() {
    renderPlatformOptions(selectA, state.platformB);
    renderPlatformOptions(selectB, state.platformA);
    selectA.value = state.platformA;
    selectB.value = state.platformB;
  }
  syncSelects();
  selectA.addEventListener("change", () => {
    state.platformA = selectA.value;
    syncSelects();
    update();
  });
  selectB.addEventListener("change", () => {
    state.platformB = selectB.value;
    syncSelects();
    update();
  });

  document.getElementById("refresh-now").addEventListener("click", () => {
    if (state.refreshing) return;
    state.refreshing = true;
    renderRefreshStatus();
    chrome.runtime.sendMessage({ type: "refresh-now" }, (result) => {
      state.refreshing = false;
      if (result?.ok) {
        loadFromStorage(() => {
          buildFilterButtons();
          syncSelects();
          update();
        });
      } else {
        state.refreshError = result?.error || "Refresh failed";
        renderRefreshStatus();
      }
    });
  });

  renderRefreshStatus();
  update();
}

function renderRefreshStatus() {
  const el = document.getElementById("refresh-status");
  if (!el) return;
  if (state.refreshing) {
    el.textContent = "Refreshing…";
  } else if (state.refreshError) {
    el.textContent = `Last refresh failed: ${state.refreshError}`;
  } else if (state.refreshedAt) {
    el.textContent = `Sleeper/ESPN/FantasyPros updated ${relativeTime(state.refreshedAt)}`;
  } else {
    el.textContent = "Showing bundled sample data — refreshing…";
  }
}

/* ---------------- live data (chrome.storage, filled in by background.js) ---------------- */

const STORAGE_KEYS = {
  players: "ff-valuediff:live-players",
  refreshedAt: "ff-valuediff:refreshed-at",
  refreshError: "ff-valuediff:refresh-error",
};

function loadFromStorage(done) {
  chrome.storage.local.get(
    [STORAGE_KEYS.players, STORAGE_KEYS.refreshedAt, STORAGE_KEYS.refreshError],
    (result) => {
      state.players = result[STORAGE_KEYS.players] || samplePlayers;
      state.refreshedAt = result[STORAGE_KEYS.refreshedAt] || null;
      state.refreshError = result[STORAGE_KEYS.refreshError] || null;
      done();
    }
  );
}

loadFromStorage(buildApp);
</script>
</body>
</html>
