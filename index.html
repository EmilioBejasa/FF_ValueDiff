function TradeVerdict({ sport = "nfl", sides, byId, rows, ctx, result }) {
  // Three assets (not already in the deal) that come closest to evening it
  // out if added to the side getting less, re-running the full formula.
  const suggestions = useMemo(() => {
    if (result.verdict === "fair" || result.verdict === "incomplete") return [];
    const loser = 1 - result.winner;
    const inDeal = new Set([...sides[0], ...sides[1]]);
    const values = sides.map((ids) => ids.map((id) => byId[id]?.value || 0));
    return rows
      .filter((r) => !inDeal.has(r.id))
      .map((r) => {
        const next = values.map((v, i) => (i === loser ? [...v, r.value] : v));
        return { r, miss: Math.abs(evaluateTrade(next, ctx).gap) };
      })
      .sort((x, y) => x.miss - y.miss)
      .slice(0, 3)
      .map((x) => x.r);
  }, [sides, byId, rows, ctx, result]);

  if (!sides[0].length && !sides[1].length) return null;
  const { adjusted, gap, pct, winner, verdict } = result;
  const winnerName = `Team ${TRADE_SIDES[winner]}`;
  const headline = { incomplete: "Add something to both sides", fair: "Fair trade", slight: `Slightly favors ${winnerName}`, favors: `Favors ${winnerName}` }[verdict];
  const waiver = replacementPlayer(ctx.playerValues, ctx.teams, 1, ctx.rosterSpots);

  return (
    <div className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
      <div className="flex items-baseline justify-between flex-wrap gap-2">
        <p className="text-base font-semibold" style={{ color: "var(--text-primary)" }}>
          {headline}
          {verdict !== "incomplete" && verdict !== "fair" && (
            <span className="font-normal text-sm" style={{ color: "var(--text-muted)" }}>
              {" "}by {Math.round(Math.abs(gap)).toLocaleString()} ({Math.round(pct * 100)}%)
            </span>
          )}
        </p>
        <p className="text-xs tabular-nums" style={{ color: "var(--text-secondary)" }}>
          Adjusted: A {Math.round(adjusted[0]).toLocaleString()} · B {Math.round(adjusted[1]).toLocaleString()}
        </p>
      </div>
      <div className="flex h-3 gap-0.5" role="img" aria-label={`Team A ${Math.round(adjusted[0])}, Team B ${Math.round(adjusted[1])}`}>
        {TRADE_SIDES.map((s, i) => (
          <div key={s} title={`Team ${s}: ${Math.round(adjusted[i]).toLocaleString()}`}
            style={{
              width: `${(adjusted[i] / Math.max(adjusted[0] + adjusted[1], 1)) * 100}%`, background: SIDE_COLOR[s],
              borderRadius: i === 0 ? "4px 0 0 4px" : "0 4px 4px 0",
            }} />
        ))}
      </div>
      {suggestions.length > 0 && (
        <p className="text-sm" style={{ color: "var(--text-secondary)" }}>
          To even it out, Team {TRADE_SIDES[1 - winner]} could also get{" "}
          {suggestions.map((r, i) => (
            <span key={r.id}>
              {i > 0 && (i === suggestions.length - 1 ? " or " : ", ")}
              <strong><PlayerLink sport={sport} id={r.id} pos={r.position} className="">{r.name}</PlayerLink></strong>{" "}
              <span className="tabular-nums" style={{ color: "var(--text-muted)" }}>({fmtValue(r.value)})</span>
            </span>
          ))}.
        </p>
      )}
      <details className="text-xs" style={{ color: "var(--text-muted)" }}>
        <summary className="cursor-pointer select-none" style={{ color: "var(--text-secondary)" }}>How this is calculated</summary>
        {ctx.raw ? (
          <p className="mt-2">Raw values is on, so each side is just the sum of FantasyCalc's values with no adjustments.</p>
        ) : (
          <div className="mt-2 flex flex-col gap-1.5">
            <p>
              <strong>Stud adjustment</strong> (like KeepTradeCut and DynastyDaddy): each player counts toward a trade score at
              between {Math.round(TRADE_FORMULA.floor * 100)}% (filler) and{" "}
              {Math.round((TRADE_FORMULA.floor + TRADE_FORMULA.trade + TRADE_FORMULA.overall) * 100)}%
              (the best player in the league) of their value, so a pile of lesser pieces can't add up to a star. The side with the
              lower score is behind by the value of the one extra player it would need to catch up.
            </p>
            <p>
              <strong>Roster spot credit</strong> (like FantasyCalc): the side getting fewer players can fill each open spot from
              waivers. In a {ctx.teams >= 16 ? "16+" : ctx.teams}-team league that's about the {waiver.rank}th-best player, worth{" "}
              {fmtValue(waiver.value)} right now. Bigger leagues have worse free agents, so the credit shrinks and depth matters more.
            </p>
            <p>
              Within {Math.round(TRADE_FAIR_PCT * 100)}% is fair; up to {Math.round(TRADE_SLIGHT_PCT * 100)}% slightly favors one side. These weights are this
              app's own blend of the two approaches, not any one site's exact formula.
            </p>
          </div>
        )}
      </details>
    </div>
  );
}

/* ---------------- league team values (Sleeper) ---------------- */
// Every team in a Sleeper league ranked by the dynasty value of its roster
// plus the rookie picks it owns. Sleeper's league endpoints are public and
// CORS-open, the same API the rest of the app uses. Sleeper only lists picks
// that have changed hands (/traded_picks), so every team starts out owning
// its own picks for the next three drafts and trades are applied on top.
const SLEEPER_API = "https://api.sleeper.app/v1";
const DYNASTY_LEAGUE_KEY = "ff-valuediff:dynasty-league";
const LEAGUE_PICK_ROUNDS = 4; // FantasyCalc values rounds 1-4
const POS_KEYS = ["QB", "RB", "WR", "TE", "PICK"];
const POS_COLOR = { QB: "var(--pos-qb)", RB: "var(--pos-rb)", WR: "var(--pos-wr)", TE: "var(--pos-te)", PICK: "var(--pos-pick)" };
const POS_LABEL = { QB: "QB", RB: "RB", WR: "WR", TE: "TE", PICK: "Picks" };
// Which positions can fill each Sleeper lineup slot (K/DEF/IDP aren't valued).
const SLOT_ELIGIBLE = {
  QB: ["QB"], RB: ["RB"], WR: ["WR"], TE: ["TE"],
  FLEX: ["RB", "WR", "TE"], WRRB_FLEX: ["WR", "RB"], REC_FLEX: ["WR", "TE"], SUPER_FLEX: ["QB", "RB", "WR", "TE"],
};
// 1 → "1st", 12 → "12th", 23 → "23rd"
const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

async function sleeperGet(path) {
  const res = await fetch(SLEEPER_API + path);
  if (!res.ok) throw new Error(`Sleeper request failed (${res.status})`);
  return res.json();
}

const isSuperflexLeague = (league) => {
  const slots = league.roster_positions || [];
  return slots.includes("SUPER_FLEX") || slots.filter((p) => p === "QB").length >= 2;
};

const nearestOption = (value, options) =>
  options.reduce((best, o) => (Math.abs(o - value) < Math.abs(best - value) ? o : best), options[0]);

// The league settings that matter for values, read from a Sleeper league:
// settings.type is 0 for redraft, 1 keeper, 2 dynasty (keepers value the
// future, so they get dynasty values); `rec` is points per catch and
// `bonus_rec_te` the TE premium on top.
function settingsFromLeague(league) {
  const scoring = league.scoring_settings || {};
  return {
    mode: league.settings?.type === 0 ? "redraft" : "dynasty",
    qb: isSuperflexLeague(league) ? "sf" : "1qb",
    teams: nearestOption(league.total_rosters || 12, [8, 10, 12, 14, 16]),
    ppr: nearestOption(scoring.rec ?? 1, [0, 0.5, 1]),
    tep: nearestOption(scoring.bonus_rec_te || 0, [0, 0.5, 1, 1.5]),
  };
}

// Best possible starting lineup by value: fill the strictest slots first
// (QB/RB/WR/TE), then flex spots, each with the best player left who fits.
function startersValue(players, rosterPositions) {
  const slots = (rosterPositions || []).filter((s) => SLOT_ELIGIBLE[s])
    .sort((x, y) => SLOT_ELIGIBLE[x].length - SLOT_ELIGIBLE[y].length);
  const left = [...players].sort((a, b) => b.value - a.value);
  let total = 0;
  for (const slot of slots) {
    const i = left.findIndex((p) => SLOT_ELIGIBLE[slot].includes(p.position));
    if (i >= 0) total += left.splice(i, 1)[0].value;
  }
  return total;
}

function buildLeagueTeams(raw, rows, byId) {
  const { league, rosters, users, traded } = raw;
  const teamName = {};
  for (const r of rosters) {
    const u = users.find((x) => x.user_id === r.owner_id);
    teamName[r.roster_id] = u ? (u.metadata?.team_name || u.display_name) : `Team ${r.roster_id}`;
  }

  // Generic FantasyCalc pick rows by year and round. Years FantasyCalc doesn't
  // list yet borrow the latest year it does.
  const pickRows = {};
  for (const r of rows) {
    const p = r.position === "PICK" && window.FantasyCalc.parsePick(r.name);
    if (p && !p.slot) pickRows[`${p.year}-${p.round}`] = r;
  }
  const pickYears = [...new Set(Object.keys(pickRows).map((k) => Number(k.split("-")[0])))].sort();
  const pickRow = (year, round) =>
    pickRows[`${year}-${round}`] || pickRows[`${pickYears.filter((y) => y <= year).pop() ?? pickYears[0]}-${round}`];

  // This season's draft still counts until it's been held.
  const season = Number(league.season);
  const first = ["pre_draft", "drafting"].includes(league.status) ? season : season + 1;
  const years = [first, first + 1, first + 2];
  const rounds = Math.min(league.settings?.draft_rounds || LEAGUE_PICK_ROUNDS, LEAGUE_PICK_ROUNDS);
  const pickOwner = {};
  for (const y of years) for (let rd = 1; rd <= rounds; rd++) for (const r of rosters) pickOwner[`${y}-${rd}-${r.roster_id}`] = r.roster_id;
  for (const t of traded) {
    const k = `${t.season}-${t.round}-${t.roster_id}`;
    if (k in pickOwner) pickOwner[k] = t.owner_id;
  }

  const teams = rosters.map((r) => {
    const players = (r.players || []).map((id) => byId[id]).filter(Boolean);
    const picks = Object.entries(pickOwner)
      .filter(([, owner]) => owner === r.roster_id)
      .map(([k]) => {
        const [y, rd, orig] = k.split("-").map(Number);
        const row = pickRow(y, rd);
        return {
          id: row?.id, position: "PICK", value: row?.value || 0,
          name: `${y} ${ordinal(rd)}${orig !== r.roster_id ? ` (via ${teamName[orig]})` : ""}`,
        };
      })
      .filter((p) => p.id);
    const assets = [...players, ...picks].sort((a, b) => b.value - a.value);
    const byPos = Object.fromEntries(POS_KEYS.map((k) => [k, assets.filter((a) => a.position === k).reduce((s, a) => s + a.value, 0)]));
    return {
      rosterId: r.roster_id, name: teamName[r.roster_id], assets, byPos,
      total: assets.reduce((s, a) => s + a.value, 0),
      starters: startersValue(players, league.roster_positions),
    };
  });
  return teams.sort((a, b) => b.total - a.total);
}

function LeagueValues({ rows, byId, settings, setSettings, onAdd }) {
  const [input, setInput] = useState(() => { try { return localStorage.getItem(DYNASTY_LEAGUE_KEY) || ""; } catch (e) { return ""; } });
  const [leagues, setLeagues] = useState(null);
  const [raw, setRaw] = useState(null);
  const [status, setStatus] = useState({ state: "idle" });
  const [expanded, setExpanded] = useState(null);

  const loadLeague = async (leagueId) => {
    setStatus({ state: "loading" });
    setExpanded(null);
    try {
      const [league, rosters, users, traded] = await Promise.all([
        sleeperGet(`/league/${leagueId}`), sleeperGet(`/league/${leagueId}/rosters`),
        sleeperGet(`/league/${leagueId}/users`), sleeperGet(`/league/${leagueId}/traded_picks`),
      ]);
      if (!league) throw new Error("no Sleeper league with that ID");
      const synced = settingsFromLeague(league);
      setSettings((s) => ({ ...s, ...synced }));
      setRaw({ league, rosters: rosters || [], users: users || [], traded: traded || [] });
      setStatus({ state: "ready" });
    } catch (err) {
      setStatus({ state: "error", message: err.message });
    }
  };

  const submit = async (e) => {
    e.preventDefault();
    const value = input.trim();
    if (!value) return;
    try { localStorage.setItem(DYNASTY_LEAGUE_KEY, value); } catch (err) {}
    setLeagues(null);
    if (/^\d{9,}$/.test(value)) return loadLeague(value);
    setStatus({ state: "loading" });
    try {
      const user = await sleeperGet(`/user/${encodeURIComponent(value)}`);
      if (!user) throw new Error(`no Sleeper user named "${value}"`);
      const state = await sleeperGet("/state/nfl");
      const list = (await sleeperGet(`/user/${user.user_id}/leagues/nfl/${state.league_season || state.season}`)) || [];
      if (list.length === 0) throw new Error(`"${value}" isn't in any leagues this season`);
      if (list.length === 1) return loadLeague(list[0].league_id);
      setLeagues(list);
      setStatus({ state: "idle" });
    } catch (err) {
      setStatus({ state: "error", message: err.message });
    }
  };

  const teams = useMemo(() => (raw ? buildLeagueTeams(raw, rows, byId) : []), [raw, rows, byId]);
  const maxTotal = teams[0]?.total || 1;

  return (
    <section className="flex flex-col gap-3">
      <header>
        <h3 className="text-base font-semibold" style={{ color: "var(--text-primary)" }}>League team values</h3>
        <p className="text-xs mt-1" style={{ color: "var(--text-muted)" }}>
          Enter a Sleeper username or league ID to rank every team by the value of its roster plus the rookie picks it
          owns (the next three drafts, rounds 1-{LEAGUE_PICK_ROUNDS}, valued as mid-round picks). "Starters" is the best
          lineup the roster can field. Loading a league switches the settings above to match it (format, QB, team count,
          scoring and TE premium). Use +A / +B on
          any player to add them to the trade above.
        </p>
      </header>

      <form onSubmit={submit} className="flex gap-2 flex-wrap">
        <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Sleeper username or league ID"
          className="rounded-md border px-3 py-1.5 text-sm flex-1" style={{ ...inputStyle, minWidth: "12rem" }} />
        <button type="submit" className="btn-primary rounded-md px-4 py-1.5 text-sm font-semibold">Load</button>
      </form>

      {leagues && (
        <div className="flex flex-col gap-1.5">
          <p className="text-xs" style={{ color: "var(--text-muted)" }}>Pick a league:</p>
          <PillGroup options={leagues.map((l) => ({ key: l.league_id, label: l.name }))}
            value={raw?.league.league_id} onChange={loadLeague} />
        </div>
      )}

      {status.state === "loading" && <p className="text-sm py-3" style={{ color: "var(--text-muted)" }}>Loading from Sleeper…</p>}
      {status.state === "error" && (
        <p className="text-sm py-3" style={{ color: "var(--text-muted)" }}>
          Couldn't load that ({status.message}). This needs the page served over http(s) with network access.
        </p>
      )}

      {status.state === "ready" && raw && (
        <div className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
          <div className="flex items-baseline justify-between flex-wrap gap-2">
            <p className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>
              {raw.league.name}{" "}
              <span className="font-normal" style={{ color: "var(--text-muted)" }}>
                · settings synced from this league: {describeSettings(settings)}
              </span>
            </p>
            <div className="flex items-center gap-3 flex-wrap">
              {POS_KEYS.map((k) => (
                <span key={k} className="text-xs flex items-center gap-1" style={{ color: "var(--text-secondary)" }}>
                  <span className="inline-block w-2.5 h-2.5 rounded-sm" style={{ background: POS_COLOR[k] }} />{POS_LABEL[k]}
                </span>
              ))}
            </div>
          </div>

          <ol className="flex flex-col">
            {teams.map((t, i) => (
              <li key={t.rosterId} className="border-b last:border-b-0" style={{ borderColor: "var(--border)" }}>
                <button type="button" onClick={() => setExpanded(expanded === t.rosterId ? null : t.rosterId)}
                  className="row-btn w-full text-left py-2 px-1 grid gap-x-3 gap-y-1 items-center"
                  style={{ gridTemplateColumns: "1.5rem minmax(0, 1fr) auto" }}>
                  <span className="text-sm tabular-nums text-right" style={{ color: "var(--text-muted)" }}>{i + 1}</span>
                  <span className="text-sm font-medium truncate" style={{ color: "var(--text-primary)" }}>
                    {expanded === t.rosterId ? "▾ " : "▸ "}{t.name}
                  </span>
                  <span className="text-sm tabular-nums text-right" style={{ color: "var(--text-primary)" }}>
                    <strong>{fmtValue(t.total)}</strong>{" "}

/* ---------------- other calculators' take ---------------- */
// The same trade judged with KeepTradeCut, DynastyProcess and Dynasty
// Superflex values instead of FantasyCalc's, run through the same formula
// (evaluateTrade) so only the values differ. Their values come from
// data/market-values.js, baked daily from Dynasty Daddy by
// scripts/refresh-market-values.js, since none of these sites let the page
// fetch them directly. They're 12-team PPR values with no league size,
// scoring or TE-premium options, and there are no generic "2027 1st" picks:
// those use the mid pick.
function marketPickKey(name) {
  const p = window.FantasyCalc?.parsePick(name);
  return p && `${p.year}-${p.round}-${p.slot || "mid"}`;
}

function MarketComparison({ sides, byId, settings, result }) {
  const bundle = window.MARKET_VALUES;
  const markets = (window.DynastyDaddy?.MARKETS || []).filter((m) => m.mode === settings.mode);

  const rows = useMemo(() => {
    if (!bundle) return [];
    return markets.map((m) => {
      const values = bundle.values[m.key]?.[settings.qb] || {};
      const lookup = (id) => {
        const r = byId[id];
        return values[r?.position === "PICK" ? marketPickKey(r.name) : id];
      };
      const missing = [];
      const sideValues = sides.map((ids) => ids.map((id) => {
        const v = lookup(id);
        if (v == null) missing.push(byId[id]?.name || id);
        return v || 0;
      }));
      const all = Object.values(values);
      const playerValues = Object.entries(values)
        .filter(([k]) => !k.includes("-")).map(([, v]) => v).sort((a, b) => b - a);
      const ctx = { topValue: Math.max(1, ...all), playerValues, teams: settings.teams, raw: settings.raw };
      return { m, result: evaluateTrade(sideValues, ctx), missing };
    });
  }, [bundle, settings.mode, sides, byId, settings.qb, settings.teams, settings.raw]);

  if (!sides[0].length || !sides[1].length) return null;

  const verdictText = (r) => {
    if (r.verdict === "fair") return "Fair";
    const who = `Team ${TRADE_SIDES[r.winner]}`;
    return `${r.verdict === "slight" ? "Slightly favors" : "Favors"} ${who} by ${Math.round(r.pct * 100)}%`;
  };
  const verdictColor = (r) => (r.verdict === "fair" ? "var(--text-primary)" : SIDE_COLOR[TRADE_SIDES[r.winner]]);
  const all = [{ m: { key: "fc", label: "FantasyCalc", url: "https://fantasycalc.com/trade-calculator" }, result, missing: [], main: true }, ...rows];
  const agree = rows.filter((r) => r.result.verdict === result.verdict && (r.result.verdict === "fair" || r.result.winner === result.winner)).length;

  return (
    <div className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
      <div className="flex items-baseline justify-between flex-wrap gap-2">
        <h3 className="text-base font-semibold" style={{ color: "var(--text-primary)" }}>What other calculators say</h3>
        {rows.length > 0 && (
          <p className="text-xs" style={{ color: "var(--text-muted)" }}>
            {agree} of {rows.length} agree with FantasyCalc
          </p>
        )}
      </div>
      {!bundle ? (
        <p className="text-sm" style={{ color: "var(--text-muted)" }}>Other sites' values didn't load (data/market-values.js is missing).</p>
      ) : (
        <div className="overflow-x-auto">
          <table className="w-full text-sm tabular-nums">
            <thead>
              <tr className="text-xs text-left" style={{ color: "var(--text-muted)" }}>
                <th className="font-medium py-1 pr-3">Calculator</th>
                <th className="font-medium py-1 pr-3 text-right">Team A</th>
                <th className="font-medium py-1 pr-3 text-right">Team B</th>
                <th className="font-medium py-1">Verdict</th>
              </tr>
            </thead>
            <tbody>
              {all.map(({ m, result: r, missing, main }) => (
                <tr key={m.key} className="border-t" style={{ borderColor: "var(--border)" }}>
                  <td className="py-1.5 pr-3 whitespace-nowrap">
                    <a href={m.url} target="_blank" rel="noopener noreferrer" className="underline" style={{ color: "var(--text-primary)" }}>{m.label}</a>
                    {main && <span className="text-xs" style={{ color: "var(--text-muted)" }}> (above)</span>}
                    {missing.length > 0 && (
                      <span className="block text-xs" style={{ color: "var(--text-muted)" }} title={missing.join(", ")}>
                        No value for {missing.length === 1 ? missing[0] : `${missing.length} assets`}
                      </span>
                    )}
                  </td>
                  <td className="py-1.5 pr-3 text-right">{fmtValue(Math.round(r.adjusted[0]))}</td>
                  <td className="py-1.5 pr-3 text-right">{fmtValue(Math.round(r.adjusted[1]))}</td>
                  <td className="py-1.5 font-medium" style={{ color: verdictColor(r) }}>{verdictText(r)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <p className="text-xs" style={{ color: "var(--text-muted)" }}>
        Each site's {settings.qb === "sf" ? "Superflex" : "1QB"} {settings.mode} values run through this calculator's
        {settings.raw ? " raw sums" : " adjustments"}, so the verdicts differ only by whose values are used; each site's own
        calculator adjusts a bit differently. These sites only publish 12-team PPR values (no TE premium), via{" "}
        <a href="https://dynasty-daddy.com" target="_blank" rel="noopener noreferrer" className="underline">Dynasty Daddy</a>,
        updated {bundle?.updatedOn || "never"}.
      </p>
    </div>
  );
}

function TradeCalculator({ data, settings, setSettings }) {
  const [sides, setSides] = useState(readTradeHash);
  useEffect(() => { writeTradeHash(sides); }, [sides]);

  const byId = useMemo(() => Object.fromEntries(data.rows.map((r) => [r.id, r])), [data.rows]);
  // A player can only be in the deal once; generic picks ("2027 1st") can repeat.
  const inDeal = useMemo(() => new Set([...sides[0], ...sides[1]].filter((id) => byId[id]?.position !== "PICK")), [sides, byId]);

  const ctx = useMemo(() => ({
    topValue: data.rows[0]?.value || 1,
    playerValues: data.rows.filter((r) => r.position !== "PICK").map((r) => r.value),
    teams: settings.teams,
    raw: settings.raw,
  }), [data.rows, settings.teams, settings.raw]);
  const result = useMemo(
    () => evaluateTrade(sides.map((ids) => ids.map((id) => byId[id]?.value || 0)), ctx),
    [sides, byId, ctx]
  );

  const add = (si, id) => {
    if (inDeal.has(id)) return;
    setSides((s) => s.map((ids, i) => (i === si ? [...ids, id] : ids)));
  };
  const remove = (si, idx) => setSides((s) => s.map((ids, i) => (i === si ? ids.filter((_, j) => j !== idx) : ids)));

  return (
    <div className="flex flex-col gap-5">
      <header>
        <h2 className="text-2xl sm:text-3xl font-bold tracking-tight" style={{ color: "var(--text-primary)" }}>Trade Calculator</h2>
        <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>
          Add what each team gets to see who comes out ahead in a {describeSettings(settings)} league.
        </p>
        <AboutData>
          <DynastyStatusLine data={data} />{" "}
          Trades that aren't one-for-one are adjusted the way the big trade calculators do it: a stud adjustment so lesser
          pieces can't add up to a star, and a roster spot credit for the side getting fewer players (see "How this is
          calculated" below). The trade is saved in the page's link, so you can copy it to share.
        </AboutData>
      </header>

      <div className="flex items-end justify-between flex-wrap gap-3">
        <LeagueSettings settings={settings} setSettings={setSettings} />
        <div className="flex items-center gap-2">
          <button type="button" onClick={() => setSettings((s) => ({ ...s, raw: !s.raw }))}
            className="pill text-xs rounded-full px-3 py-1 font-medium" aria-pressed={settings.raw}
            title="Compare plain sums of values, with no stud adjustment or roster spot credit"
            style={{ "--pill-accent": "var(--hue-violet)" }}>Raw values</button>
          {(sides[0].length > 0 || sides[1].length > 0) && (
            <button type="button" onClick={() => setSides([[], []])} className="pill text-xs rounded-full px-3 py-1 font-medium"
              style={{ "--pill-accent": "var(--series-red)" }}>Clear trade</button>
          )}
        </div>
      </div>

      <div className="grid gap-4 md:grid-cols-2">
        {TRADE_SIDES.map((s, si) => (
          <TradeSide key={s} label={`Team ${s}`} color={SIDE_COLOR[s]} ids={sides[si]} byId={byId} rows={data.rows}
            exclude={inDeal} onAdd={(id) => add(si, id)} onRemove={(idx) => remove(si, idx)} result={result} index={si} />
        ))}
      </div>

      <TradeVerdict sides={sides} byId={byId} rows={data.rows} ctx={ctx} result={result} />

      <MarketComparison sides={sides} byId={byId} settings={settings} result={result} />

      <LeagueValues rows={data.rows} byId={byId} settings={settings} setSettings={setSettings} onAdd={add} />
    </div>
  );
}

const CLASS_LEAGUE_SIZE = 12;
function pickSlotForRank(rank) {
  if (!rank) return null;
  const round = Math.ceil(rank / CLASS_LEAGUE_SIZE);
  const third = Math.ceil(((rank - 1) % CLASS_LEAGUE_SIZE + 1) / (CLASS_LEAGUE_SIZE / 3));
  return { round, slot: ["early", "mid", "late"][third - 1] };
}

                const slot = pickSlotForRank(p[rankKey]);
                const pick = slot && picks2027[`${slot.round}-${slot.slot}`];
                return (
                  <tr key={p.name} className="border-b align-top" style={{ borderColor: "var(--border)" }}>
                    <td className="px-3 py-2 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{p[rankKey]}</td>
                    <td className="px-3 py-2 whitespace-nowrap">

                      <div className="text-xs" style={{ color: "var(--text-muted)" }}>
                        <PosBadge pos={p.position} /> {p.school}{p.size ? ` · ${p.size}` : ""}
                      </div>

                    <td className="px-3 py-2 text-sm" style={{ color: "var(--text-secondary)", minWidth: "16rem" }}>
                      {p.note || <span style={{ color: "var(--text-muted)" }}>–</span>}
                    </td>
                    <td className="px-3 py-2 text-right whitespace-nowrap">
                      {pick ? (
                        <>
                          <div className="text-xs" style={{ color: "var(--text-secondary)" }}>{pick.name}</div>
                          <div className="tabular-nums font-semibold" style={{ color: "var(--text-primary)" }}>{fmtValue(pick.value)}</div>
                        </>
                      ) : <span className="text-xs" style={{ color: "var(--text-muted)" }}>Round {slot?.round ?? "–"}+</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {unranked.length > 0 && (
        <p className="text-xs" style={{ color: "var(--text-muted)" }}>
          Outside the top 30 in {format === "sf" ? "Superflex" : "1QB"}: {unranked.map((p) => `${p.name} (${p.position}, ${p.school})`).join(", ")}.
        </p>
      )}

      <p className="text-xs" style={{ color: "var(--text-muted)" }}>
        "Projected pick" is the 2027 rookie pick that rank lines up with in a 12-team league (ranks 1-4 are early 1sts,
        5-8 mid, 9-12 late, and so on), at FantasyCalc's current value. Sources:{" "}
        {CLASS_2027_SOURCES.map((s, i) => (
          <span key={s.url}>
            {i > 0 && "; "}
            <a href={s.url} target="_blank" rel="noopener noreferrer" className="underline">{s.label}</a>
          </span>
        ))}.
      </p>
    </div>
  );
}

/* ---------------- basketball (season-long / redraft) ---------------- */
// The basketball side: points leagues only, season-long (no dynasty). All of
// it is live from Sleeper (scripts/lib/sleeper-nba.js); there's no baked
// snapshot, so it needs the page served over http(s) with network access.

const NBA_SETTINGS_KEY = "ff-valuediff:nba-settings-v1";
const DEFAULT_NBA_SETTINGS = { scoring: "standard", teams: 12, raw: false };
const NBA_SETTING_OPTIONS = {
  scoring: [{ key: "standard", label: "Standard" }, { key: "espn", label: "ESPN" }],
  teams: [8, 10, 12, 14, 16].map((n) => ({ key: n, label: String(n) })),
};
const NBA_SCORING_NOTE = {
  standard: "Standard scoring is the NBA's official fantasy scoring, which Yahoo uses by default: points 1, rebounds 1.2, assists 1.5, steals 3, blocks 3, turnovers −1.",
  espn: "ESPN scoring is ESPN's default points league, which also charges for misses: points 1, 3-pointers made 1, field goals made 2, field goal attempts −1, free throws made 1, free throw attempts −1, rebounds 1, assists 2, steals 4, blocks 4, turnovers −2.",
};

function readSavedNbaSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(NBA_SETTINGS_KEY) || "null");
    if (saved) return { ...DEFAULT_NBA_SETTINGS, ...saved };
  } catch (e) {}
  return DEFAULT_NBA_SETTINGS;
}

// Sleeper names a season by the year it starts: "2025" is 2025-26.
const nbaSeasonLabel = (s) => `${s}-${String(Number(s) + 1).slice(2)}`;
// A full regular season is 25 Sleeper fantasy weeks (Monday to Sunday) and 82
// games per team.
const NBA_SEASON_WEEKS = 25;
const NBA_TEAM_GAMES = 82;

const NBA_CACHE = (k) => `ff-valuediff:nba-v1:${k}`;
function nbaCacheGet(key, ttl) {
  try {
    const c = JSON.parse(localStorage.getItem(NBA_CACHE(key)) || "null");
    if (c && Date.now() - c.at < ttl) return c.data;
  } catch (e) {}
  return null;
}
function nbaCacheSet(key, data) {
  try { localStorage.setItem(NBA_CACHE(key), JSON.stringify({ at: Date.now(), data })); } catch (e) {}
}
async function nbaCached(key, ttl, load) {
  const hit = nbaCacheGet(key, ttl);
  if (hit) return hit;
  const data = await load();
  nbaCacheSet(key, data);
  return data;
}

// Everything the basketball pages share, loaded the first time one of them
// opens: Sleeper's current NBA state, season totals for this season and last
// (this season is empty until tip-off, so last season fills in until then),
// and the trimmed player list (injuries, current teams, ages). While a
// basketball page stays open it re-checks on useRefreshTick; anything whose
// cache has expired is fetched again and swapped in without a loading screen.
function useNbaData(enabled) {
  const [data, setData] = useState({ status: "idle", seasons: {}, players: {} });
  const tick = useRefreshTick();
  const loaded = useRef(false);
  const busy = useRef(false);
  useEffect(() => {
    if (!enabled || busy.current) return;
    if (!window.SleeperNBA) {
      setData((d) => ({ ...d, status: "error", message: "scripts/lib/sleeper-nba.js didn't load" }));
      return;
    }
    const N = window.SleeperNBA;
    const refreshing = loaded.current;
    busy.current = true;
    if (!refreshing) setData((d) => ({ ...d, status: "loading" }));
    (async () => {
      // On a background refresh, only re-render if something actually expired.
      let fetched = false;
      const get = (k, ttl, load) => nbaCached(k, ttl, () => { fetched = true; return load(); });
      const state = await get("state", 10 * 60 * 1000, N.fetchState);
      const seasons = {};
      await Promise.all([state.season, state.previous_season].map(async (s) => {
        const ttl = s === state.season ? 60 * 60 * 1000 : 24 * 60 * 60 * 1000;
        seasons[s] = await get(`season-${s}`, ttl, () => N.fetchSeason(s));
      }));
      const players = await get("players", 6 * 60 * 60 * 1000, N.fetchPlayers);
      if (refreshing && !fetched) return;
      loaded.current = true;
      setData({ status: "live", state, seasons, players, updatedOn: new Date().toLocaleString() });
    })()
      // A failed background refresh just leaves the last data up.
      .catch((err) => { if (!refreshing) setData((d) => ({ ...d, status: "error", message: err.message })); })
      .finally(() => { busy.current = false; });
  }, [enabled, tick]);

  // The season the pages default to: this one once it has games, else last.
  const ready = data.status === "live";
  const currentHasGames = ready && (data.seasons[data.state.season] || []).length > 0;
  const activeSeason = ready ? (currentHasGames ? data.state.season : data.state.previous_season) : null;
  return { ...data, activeSeason, currentHasGames };
}

// Fantasy weeks played in a season (1 … n).
function nbaWeeksFor(data, season) {
  if (season !== data.state.season) return NBA_SEASON_WEEKS;
  const type = data.state.season_type;
  if (type === "regular") return Math.max(0, data.state.week);
  return type === "post" ? NBA_SEASON_WEEKS : 0;
}

// One fantasy week's games, fetched on demand and cached (past weeks for a
// day, the current week for ten minutes).
function useNbaWeek(data, season, week, enabled = true) {
  const [res, setRes] = useState({ status: "idle", players: [] });
  useEffect(() => {
    if (!enabled || !season || !week || !window.SleeperNBA) return;
    let cancelled = false;
    const live = season === data.state?.season && week >= nbaWeeksFor(data, season);
    setRes({ status: "loading", players: [] });
    nbaCached(`week-${season}-${week}`, live ? 10 * 60 * 1000 : 24 * 60 * 60 * 1000,
      () => window.SleeperNBA.fetchWeek(season, week))
      .then((players) => { if (!cancelled) setRes({ status: "live", players }); })
      .catch((err) => { if (!cancelled) setRes({ status: "error", players: [], message: err.message }); });
    return () => { cancelled = true; };
  }, [season, week, enabled]);
  return res;
}

const nbaPoints = (stats, scoring) => window.SleeperNBA.fantasyPoints(stats, scoring);
const nbaFpg = (p, scoring) => (p && p.gp ? nbaPoints(p.stats, scoring) / p.gp : 0);
const fmt1 = (n) => (n == null || Number.isNaN(n) ? "–" : n.toFixed(1));

const NBA_POSITIONS = ["PG", "SG", "SF", "PF", "C"];
const NBA_POSITION_OPTIONS = [{ key: "ALL", label: "ALL" }, ...NBA_POSITIONS.map((p) => ({ key: p, label: p, color: posPillColor(p) }))];
const nbaPosMatch = (p, pos) => pos === "ALL" || p.position === pos || (p.positions || []).includes(pos);

// Shown on every basketball page until the data arrives (or if it can't).
function NbaGate({ data, children }) {
  if (data.status === "live") return children;
  return (
    <div className="rounded-lg border p-8 text-center text-sm" style={{ borderColor: "var(--border)", background: "var(--surface-1)", color: "var(--text-muted)" }}>
      {data.status === "error"
        ? <>Couldn't reach Sleeper ({data.message}). The basketball pages are live-only, so they need the page served over
            http(s) with network access.</>
        : "Loading basketball data from Sleeper…"}
    </div>
  );
}

function NbaSeasonNote({ data }) {
  if (data.currentHasGames) return null;
  const start = data.state.season_start_date;
  return (
    <div className="rounded-lg border px-4 py-3 text-sm" style={{ borderColor: "var(--brass)", background: "var(--surface-1)", color: "var(--text-secondary)" }}>
      The {nbaSeasonLabel(data.state.season)} season hasn't tipped off yet{start ? ` (opening night is ${new Date(start + "T12:00:00").toLocaleDateString(undefined, { month: "long", day: "numeric" })})` : ""}, so
      this shows last season, {nbaSeasonLabel(data.state.previous_season)}. It switches over on its own once games are played.
    </div>
  );
}

function NbaPageHeader({ title, lead, children }) {
  return (
    <header>
      <h2 className="text-2xl sm:text-3xl font-bold tracking-tight" style={{ color: "var(--text-primary)" }}>{title}</h2>
      <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>{lead}</p>
      <AboutData>{children}</AboutData>
    </header>

}

const NbaInjuryTag = ({ status }) => status ? (
  <span className="text-xs font-semibold ml-1.5" style={{ color: NBA_STATUS_COLOR[status] || "var(--series-amber)" }}>{status}</span>
) : null;

// Most to least serious. GTD is game-time decision, DTD day-to-day.
const NBA_STATUSES = ["Out", "IR", "Sus", "Doubtful", "Questionable", "GTD", "DTD", "NA"];
const NBA_STATUS_COLOR = { Out: "var(--series-red)", IR: "var(--series-red)", Sus: "var(--series-red)", Doubtful: "var(--series-red)" };
const NBA_STATUS_LABEL = { GTD: "Game-time decision", DTD: "Day-to-day", Sus: "Suspended", NA: "Not active" };

/* ---------- Scoreboard ---------- */

function NbaScoreboard({ data, settings, setSettings }) {
  const seasons = [data.state.season, data.state.previous_season].filter((s) => nbaWeeksFor(data, s) > 0);
  const [pickedSeason, setSeason] = useState(null);
  const season = pickedSeason ?? data.activeSeason;
  const weeks = nbaWeeksFor(data, season);
  const [pickedWeek, setWeek] = useState(null);
  const week = pickedWeek && pickedWeek <= weeks ? pickedWeek : weeks;
  const [pos, setPos] = useState("ALL");
  const res = useNbaWeek(data, season, week);

  const rows = useMemo(() => res.players
    .filter((p) => nbaPosMatch(p, pos))
    .map((p) => {
      const games = p.games.map((g) => ({ ...g, fp: nbaPoints(g.stats, settings.scoring) }));
      const total = games.reduce((s, g) => s + g.fp, 0);
      return { ...p, games, total, fpg: total / games.length };
    })
    .sort((a, b) => b.total - a.total), [res.players, pos, settings.scoring]);

  const day = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });
  const first = rows.flatMap((r) => r.games.map((g) => g.date)).sort()[0];
  const last = rows.flatMap((r) => r.games.map((g) => g.date)).sort().pop();

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Weekly Scores" lead="Every player's fantasy points for one fantasy week (Monday to Sunday), game by game.">
        Live from Sleeper's NBA stats. A fantasy week runs Monday to Sunday, so players can have anywhere from zero to
        four or five games; the total is what counts in a weekly head-to-head points matchup. {NBA_SCORING_NOTE[settings.scoring]}
      </NbaPageHeader>
      <NbaSeasonNote data={data} />

      <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
        <LabeledControl label="Season">
          <PillGroup options={seasons.map((s) => ({ key: s, label: nbaSeasonLabel(s) }))} value={season} onChange={(s) => { setSeason(s); setWeek(null); }} />
        </LabeledControl>
        <LabeledControl label="Scoring">
          <PillGroup options={NBA_SETTING_OPTIONS.scoring} value={settings.scoring} accent="var(--hue-violet)"
            onChange={(v) => setSettings((s) => ({ ...s, scoring: v }))} />
        </LabeledControl>
        <LabeledControl label="Position">
          <PillGroup options={NBA_POSITION_OPTIONS} value={pos} onChange={setPos} />
        </LabeledControl>
      </div>
      <LabeledControl label={`Week${first ? ` · ${day(first)} – ${day(last)}` : ""}`}>
        <PillGroup options={Array.from({ length: weeks }, (_, i) => ({ key: i + 1, label: `Wk ${i + 1}` }))} value={week} onChange={setWeek} />
      </LabeledControl>

      {res.status === "loading" && <p className="text-sm py-6 text-center" style={{ color: "var(--text-muted)" }}>Loading Week {week}…</p>}
      {res.status === "error" && <p className="text-sm py-6 text-center" style={{ color: "var(--text-muted)" }}>Couldn't load Week {week} ({res.message}).</p>}
      {res.status === "live" && (
        <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
          <table className="w-full border-collapse text-sm">
            <thead>
              <tr>
                {["RK", "Player", "Pos", "Games", "GP", "FPG", "Total"].map((h, i) => (
                  <th key={h} className={`px-3 py-2 text-xs font-semibold sticky top-0 z-10 ${i >= 4 || i === 0 ? "text-right" : "text-left"}`}
                    style={{ color: h === "Total" ? "var(--text-primary)" : "var(--text-muted)" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.length === 0 && (
                <tr><td colSpan={7} className="px-3 py-6 text-center" style={{ color: "var(--text-muted)" }}>No games this week.</td></tr>
              )}
              {rows.map((r, i) => (
                <tr key={r.id} className="border-b row-hover" style={{ borderColor: "var(--border)" }}>
                  <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{i + 1}</td>
                  <td className="px-3 py-1.5 whitespace-nowrap">
                    <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                    <span className="text-xs" style={{ color: "var(--text-muted)" }}>{r.team}</span>
                  </td>
                  <td className="px-3 py-1.5"><PosBadge pos={r.position} /></td>
                  <td className="px-3 py-1.5">
                    <span className="flex gap-1 flex-wrap">
                      {r.games.map((g) => (
                        <span key={g.date} className="text-[11px] tabular-nums rounded px-1.5 py-0.5 whitespace-nowrap"
                          title={`${day(g.date)} vs ${g.opp || "?"}: ${fmt1(g.fp)} pts`}
                          style={{ background: "var(--surface-2)", color: "var(--text-secondary)" }}>
                          {day(g.date).split(",")[0]} <strong style={{ color: "var(--text-primary)" }}>{fmt1(g.fp)}</strong>
                        </span>
                      ))}
                    </span>
                  </td>
                  <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{r.games.length}</td>
                  <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{fmt1(r.fpg)}</td>
                  <td className="px-3 py-1.5 text-right tabular-nums font-semibold" style={{ color: "var(--text-primary)" }}>{fmt1(r.total)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function LabeledControl({ label, children }) {
  return (
    <div className="flex flex-col gap-1">
      <span className="text-xs" style={{ color: "var(--text-muted)" }}>{label}</span>
      {children}
    </div>
  );
}

/* ---------- Big Board (rankings) ---------- */

const NBA_RANK_SORTS = {
  fpg: (a, b) => b.fpg - a.fpg,
  total: (a, b) => b.total - a.total,
  gp: (a, b) => b.gp - a.gp || b.fpg - a.fpg,
};
const NBA_PER_GAME = [["pts", "PTS"], ["reb", "REB"], ["ast", "AST"], ["stl", "STL"], ["blk", "BLK"], ["tpm", "3PM"], ["to", "TO"]];

// Enough games to rank: 20 for a finished season, a third of the games played
// so far in a season in progress.
function nbaMinGames(rows, season, data) {
  if (season !== data.state.season || data.state.season_type !== "regular") return 20;
  return Math.max(1, Math.round(Math.max(0, ...rows.map((p) => p.gp)) / 3));
}

function NbaRankings({ data, settings, setSettings }) {
  const seasons = [data.state.season, data.state.previous_season].filter((s) => (data.seasons[s] || []).length > 0);
  const [pickedSeason, setSeason] = useState(null);
  const season = pickedSeason ?? data.activeSeason;
  const [pos, setPos] = useState("ALL");
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("fpg");
  const all = data.seasons[season] || [];
  const minGp = nbaMinGames(all, season, data);

  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    return all
      .filter((p) => p.gp >= minGp && nbaPosMatch(p, pos))
      .filter((p) => !q || p.name.toLowerCase().includes(q) || (p.team || "").toLowerCase() === q)
      .map((p) => ({ ...p, fpg: nbaFpg(p, settings.scoring), total: nbaPoints(p.stats, settings.scoring) }))
      .sort(NBA_RANK_SORTS[sortBy]);
  }, [all, minGp, pos, query, sortBy, settings.scoring]);

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Player Rankings" lead={`Every player ranked by fantasy points per game in ${settings.scoring === "espn" ? "ESPN" : "Standard"} scoring.`}>
        Season totals live from Sleeper. Players need at least {minGp} games to be ranked. Per-game columns are real
        averages for the season shown. {NBA_SCORING_NOTE[settings.scoring]}
      </NbaPageHeader>
      <NbaSeasonNote data={data} />

      <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
        <LabeledControl label="Season">
          <PillGroup options={seasons.map((s) => ({ key: s, label: nbaSeasonLabel(s) }))} value={season} onChange={setSeason} />
        </LabeledControl>
        <LabeledControl label="Scoring">
          <PillGroup options={NBA_SETTING_OPTIONS.scoring} value={settings.scoring} accent="var(--hue-violet)"
            onChange={(v) => setSettings((s) => ({ ...s, scoring: v }))} />
        </LabeledControl>
        <LabeledControl label="Position">
          <PillGroup options={NBA_POSITION_OPTIONS} value={pos} onChange={setPos} />
        </LabeledControl>
        <input type="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search player or team"
          className="rounded-md border px-3 py-1.5 text-sm w-full sm:w-56 sm:ml-auto" style={inputStyle} />
      </div>

      <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
        <table className="w-full border-collapse text-sm">
          <thead>
            <tr>
              <th className="text-right px-3 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>RK</th>
              <th className="text-left px-3 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>Player</th>
              <th className="text-left px-3 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>Pos</th>
              <SortHeader label="GP" active={sortBy === "gp"} onClick={() => setSortBy("gp")} />
              <SortHeader label="FPG" active={sortBy === "fpg"} onClick={() => setSortBy("fpg")} />
              <SortHeader label="Total" active={sortBy === "total"} onClick={() => setSortBy("total")} />
              {NBA_PER_GAME.map(([, h]) => (
                <th key={h} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr><td colSpan={13} className="px-3 py-6 text-center" style={{ color: "var(--text-muted)" }}>No matches.</td></tr>
            )}
            {rows.map((r, i) => (
              <tr key={r.id} className="border-b row-hover" style={{ borderColor: "var(--border)" }}>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{i + 1}</td>
                <td className="px-3 py-1.5 whitespace-nowrap">
                  <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>{data.players[r.id]?.team || r.team}</span>
                  <NbaInjuryTag status={data.players[r.id]?.status} />
                </td>
                <td className="px-3 py-1.5"><PosBadge pos={r.position} /></td>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{r.gp}</td>
                <td className="px-3 py-1.5 text-right tabular-nums font-semibold" style={{ color: "var(--text-primary)" }}>{fmt1(r.fpg)}</td>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{Math.round(r.total).toLocaleString()}</td>
                {NBA_PER_GAME.map(([k]) => (
                  <td key={k} className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{fmt1((r.stats[k] || 0) / r.gp)}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- Waiver Desk ---------- */

function NbaWaivers({ data, settings }) {
  const [direction, setDirection] = useState("add");
  const [trend, setTrend] = useState({ status: "loading", rows: [] });
  const season = data.activeSeason;
  const byId = useMemo(() => Object.fromEntries((data.seasons[season] || []).map((p) => [p.id, p])), [data, season]);

  useEffect(() => {
    let cancelled = false;
    setTrend({ status: "loading", rows: [] });
    window.SleeperNBA.fetchTrending(direction, 40)
      .then((list) => { if (!cancelled) setTrend({ status: "live", rows: list.filter((t) => data.players[t.player_id]).slice(0, 20) }); })
      .catch((err) => { if (!cancelled) setTrend({ status: "error", rows: [], message: err.message }); });
    return () => { cancelled = true; };
  }, [direction]);

  // Heating up: biggest jump in fantasy points per game over the last two
  // fantasy weeks versus the player's season average (current season only).
  const weeks = data.currentHasGames ? nbaWeeksFor(data, data.state.season) : 0;
  const w1 = useNbaWeek(data, data.state.season, weeks, weeks >= 2);
  const w2 = useNbaWeek(data, data.state.season, weeks - 1, weeks >= 2);
  const hot = useMemo(() => {
    if (weeks < 2 || w1.status !== "live" || w2.status !== "live") return [];
    const recent = {};
    for (const p of [...w1.players, ...w2.players]) {
      const r = recent[p.id] || (recent[p.id] = { p, pts: 0, gp: 0 });
      for (const g of p.games) { r.pts += nbaPoints(g.stats, settings.scoring); r.gp++; }
    }
    return Object.values(recent)
      .filter((r) => r.gp >= 2)
      .map((r) => ({ ...r.p, recent: r.pts / r.gp, gp: r.gp, season: nbaFpg(byId[r.p.id], settings.scoring) }))
      .filter((r) => r.recent >= 20)
      .map((r) => ({ ...r, jump: r.recent - r.season }))
      .sort((a, b) => b.jump - a.jump)
      .slice(0, 12);
  }, [weeks, w1, w2, settings.scoring, byId]);

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Waiver Wire" lead="Who Sleeper managers are adding and dropping right now, and who's heating up.">
        Trending adds and drops are live from Sleeper (last 24 hours across real Sleeper leagues). FPG is fantasy points
        per game for {nbaSeasonLabel(season)} in {settings.scoring === "espn" ? "ESPN" : "Standard"} scoring. "Heating up"
        compares each player's last two fantasy weeks with his season average (2+ games, 20+ points per game lately).
      </NbaPageHeader>

      <section className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <h3 className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>
            Trending on Sleeper <span className="font-normal" style={{ color: "var(--text-muted)" }}>· live</span>
          </h3>
          <PillGroup options={[{ key: "add", label: "Adds" }, { key: "drop", label: "Drops" }]} value={direction} onChange={setDirection} />
        </div>
        {trend.status === "loading" && <p className="text-sm py-3 text-center" style={{ color: "var(--text-muted)" }}>Loading…</p>}
        {trend.status === "error" && <p className="text-sm py-3 text-center" style={{ color: "var(--text-muted)" }}>Couldn't reach Sleeper ({trend.message}).</p>}
        {trend.status === "live" && (
          <ol className="grid gap-x-6 sm:grid-cols-2">
            {trend.rows.map((t, i) => {
              const p = data.players[t.player_id];
              const s = byId[t.player_id];
              return (
                <li key={t.player_id} className="flex items-center justify-between gap-3 py-1.5 border-b text-sm" style={{ borderColor: "var(--border)" }}>
                  <span className="min-w-0 truncate">
                    <span className="tabular-nums text-xs mr-2" style={{ color: "var(--text-muted)" }}>{i + 1}</span>
                    <PlayerLink sport="nba" id={t.player_id}>{p.name}</PlayerLink>{" "}
                    <PosBadge pos={p.position} /> <span className="text-xs" style={{ color: "var(--text-muted)" }}>{p.team}</span>
                    <NbaInjuryTag status={p.status} />
                  </span>
                  <span className="flex items-center gap-3 shrink-0 tabular-nums">
                    <span className="text-xs" style={{ color: "var(--text-secondary)" }}>{s ? `${fmt1(nbaFpg(s, settings.scoring))} FPG` : "no games"}</span>
                    <span className="font-semibold" style={{ color: direction === "add" ? "var(--trend-up)" : "var(--series-red)" }}>
                      {t.count.toLocaleString()}
                    </span>
                  </span>
                </li>
              );
            })}
          </ol>
        )}
      </section>

      <section className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
        <h3 className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>Heating up <span className="font-normal" style={{ color: "var(--text-muted)" }}>· last two weeks vs. season</span></h3>
        {weeks < 2 ? (
          <p className="text-sm" style={{ color: "var(--text-muted)" }}>
            Shows up once the {nbaSeasonLabel(data.state.season)} season has two fantasy weeks of games.
          </p>
        ) : hot.length === 0 ? (
          <p className="text-sm" style={{ color: "var(--text-muted)" }}>{w1.status === "live" && w2.status === "live" ? "Nobody's jumped enough to list yet." : "Loading…"}</p>
        ) : (
          <ol className="flex flex-col">
            {hot.map((r) => (
              <li key={r.id} className="flex items-center justify-between gap-3 py-1.5 border-b text-sm" style={{ borderColor: "var(--border)" }}>
                <span className="min-w-0 truncate">
                  <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                  <PosBadge pos={r.position} /> <span className="text-xs" style={{ color: "var(--text-muted)" }}>{r.team}</span>

                  <span style={{ color: "var(--text-secondary)" }}>{fmt1(r.recent)} FPG in {r.gp} games · season {fmt1(r.season)}</span>
                  <span className="font-semibold text-sm" style={{ color: "var(--trend-up)" }}>▲ {fmt1(r.jump)}</span>

  );

/* ---------- Trade Desk (season-long) ---------- */

// Trade value for a season-long league: projected fantasy points for the
// rest of the season = points per game × team games left × how often the
// player actually plays.
// - Points per game blends this season with last: last season counts as
//   (15 − games played this season) games of weight, so it fades out after
//   15 games. Before tip-off it's simply last season.
// - Availability is games played ÷ team games (this season once he's played
//   10, otherwise last season), kept between 50% and 100%.
// Rookies and anyone without NBA games yet have no value until they play.
const NBA_BLEND_GAMES = 15;
const NBA_ROSTER_SPOTS = 13;

function nbaTradeRows(data, scoring) {
  const { state, seasons, players } = data;
  const cur = seasons[state.season] || [];
  const prev = seasons[state.previous_season] || [];
  const curById = Object.fromEntries(cur.map((p) => [p.id, p]));
  const prevById = Object.fromEntries(prev.map((p) => [p.id, p]));
  const teamGames = Math.max(0, ...cur.map((p) => p.gp));
  const inSeason = state.season_type === "regular" && teamGames > 0;
  const gamesLeft = inSeason ? Math.max(NBA_TEAM_GAMES - teamGames, 1) : NBA_TEAM_GAMES;

  const rows = [];
  for (const id of new Set([...cur.map((p) => p.id), ...prev.map((p) => p.id)])) {
    const c = curById[id], p = prevById[id];
    const curGp = c ? c.gp : 0;
    const prevFpg = p ? nbaFpg(p, scoring) : null;
    const k = prevFpg != null ? Math.max(0, NBA_BLEND_GAMES - curGp) : 0;
    if (curGp + k === 0) continue;
    const fpg = ((c ? nbaPoints(c.stats, scoring) : 0) + (prevFpg || 0) * k) / (curGp + k);
    const avail = Math.min(1, Math.max(0.5, curGp >= 10 && teamGames ? curGp / teamGames : p ? p.gp / NBA_TEAM_GAMES : 0.8));
    const base = c || p;
    const now = players[id];
    rows.push({
      id, name: base.name, position: now?.position || base.position, team: now?.team || base.team, age: now?.age || null,
      fpg, avail, value: Math.round(fpg * gamesLeft * avail),
    });
  }
  rows.sort((a, b) => b.value - a.value);
  const posCount = {};
  return { rows: rows.map((r) => ({ ...r, posRank: (posCount[r.position] = (posCount[r.position] || 0) + 1) })), gamesLeft };
}

function NbaTrade({ data, settings, setSettings }) {
  const [sides, setSides] = useState(() => readTradeHash("nbatrade"));
  useEffect(() => { writeTradeHash(sides, "nbatrade", "#/nba/trade"); }, [sides]);

  const { rows, gamesLeft } = useMemo(() => nbaTradeRows(data, settings.scoring), [data, settings.scoring]);
  const byId = useMemo(() => Object.fromEntries(rows.map((r) => [r.id, r])), [rows]);
  const inDeal = useMemo(() => new Set([...sides[0], ...sides[1]]), [sides]);
  const ctx = useMemo(() => ({
    topValue: rows[0]?.value || 1,
    playerValues: rows.map((r) => r.value),
    teams: settings.teams,
    raw: settings.raw,
    rosterSpots: NBA_ROSTER_SPOTS,
    fairMin: 100,
  }), [rows, settings.teams, settings.raw]);
  const result = useMemo(() => evaluateTrade(sides.map((ids) => ids.map((id) => byId[id]?.value || 0)), ctx), [sides, byId, ctx]);

  const add = (si, id) => { if (!inDeal.has(id)) setSides((s) => s.map((ids, i) => (i === si ? [...ids, id] : ids))); };
  const remove = (si, idx) => setSides((s) => s.map((ids, i) => (i === si ? ids.filter((_, j) => j !== idx) : ids)));

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Trade Analyzer" lead={`See who wins a season-long trade in a ${settings.teams >= 16 ? "16+" : settings.teams}-team ${settings.scoring === "espn" ? "ESPN" : "Standard"} points league.`}>
        Each player's value is his projected fantasy points for the rest of the season: points per game × the {gamesLeft} team
        games left × how often he plays (games played ÷ team games, 50-100%). Points per game blends this season with last
        season until he's played {NBA_BLEND_GAMES} games; before tip-off it's last season's. Rookies and anyone without NBA
        games yet aren't valued until they play. Trades that aren't one-for-one get the same stud adjustment and roster spot
        credit as the football Trade Desk, with {NBA_ROSTER_SPOTS}-man rosters. {NBA_SCORING_NOTE[settings.scoring]}
      </NbaPageHeader>
      <NbaSeasonNote data={data} />

      <div className="flex items-end justify-between flex-wrap gap-3">
        <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
          <LabeledControl label="Scoring">
            <PillGroup options={NBA_SETTING_OPTIONS.scoring} value={settings.scoring} accent="var(--hue-violet)"
              onChange={(v) => setSettings((s) => ({ ...s, scoring: v }))} />
          </LabeledControl>
          <LabeledControl label="Teams">
            <PillGroup options={NBA_SETTING_OPTIONS.teams} value={settings.teams} accent="var(--hue-violet)"
              onChange={(v) => setSettings((s) => ({ ...s, teams: v }))} />
          </LabeledControl>
        </div>
        <div className="flex items-center gap-2">
          <button type="button" onClick={() => setSettings((s) => ({ ...s, raw: !s.raw }))}
            className="pill text-xs rounded-full px-3 py-1 font-medium" aria-pressed={settings.raw}
            title="Compare plain sums, with no stud adjustment or roster spot credit"
            style={{ "--pill-accent": "var(--hue-violet)" }}>Raw values</button>
          {(sides[0].length > 0 || sides[1].length > 0) && (
            <button type="button" onClick={() => setSides([[], []])} className="pill text-xs rounded-full px-3 py-1 font-medium"
              style={{ "--pill-accent": "var(--series-red)" }}>Clear trade</button>
          )}
        </div>
      </div>

      <div className="grid gap-4 md:grid-cols-2">
        {TRADE_SIDES.map((s, si) => (
          <TradeSide key={s} sport="nba" label={`Team ${s}`} color={SIDE_COLOR[s]} ids={sides[si]} byId={byId} rows={rows}
            exclude={inDeal} onAdd={(id) => add(si, id)} onRemove={(idx) => remove(si, idx)} result={result} index={si} />
        ))}
      </div>

      <TradeVerdict sport="nba" sides={sides} byId={byId} rows={rows} ctx={ctx} result={result} />
    </div>
  );
}

/* ---------- Projected Rankings ---------- */
// Sleeper's season projections, ranked in the league's scoring. Each
// projection is a per-game stat line, so projected points = projected FPG ×
// the team games left × how often the player has played (the same
// availability the Trade Analyzer uses; 80% for anyone with no NBA games).
// Only players on an NBA roster are kept, which also keeps the cache small.
function useNbaProjections(data, enabled) {
  const season = data.state?.season;
  const [state, setState] = useState({ status: "loading", rows: [] });
  const tick = useRefreshTick();
  useEffect(() => {
    if (!enabled || !season) return;
    let cancelled = false;
    nbaCached(`proj-${season}`, 6 * 60 * 60 * 1000, async () =>
      (await window.SleeperNBA.fetchProjections(season)).filter((r) => data.players[r.id]))
      .then((rows) => { if (!cancelled) setState({ status: "live", rows }); })
      // A failed background refresh keeps the last list up.
      .catch((err) => { if (!cancelled) setState((s) => (s.rows.length ? s : { status: "error", message: err.message, rows: [] })); });
    return () => { cancelled = true; };
  }, [season, enabled, tick]);
  return state;
}

const NBA_PROJ_SORTS = {
  total: (a, b) => b.total - a.total,
  fpg: (a, b) => b.fpg - a.fpg,
  adp: (a, b) => (a.adp ?? 999) - (b.adp ?? 999),
};

function NbaProjections({ data, settings, setSettings }) {
  const proj = useNbaProjections(data, true);
  const [pos, setPos] = useState("ALL");
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("total");
  const scoringLabel = settings.scoring === "espn" ? "ESPN" : "Standard";
  const season = data.state.season;
  // Compare against this season's real FPG once games are played, else last season's.
  const cmpSeason = data.currentHasGames ? season : data.state.previous_season;

  const { rows: valueRows, gamesLeft } = useMemo(() => nbaTradeRows(data, settings.scoring), [data, settings.scoring]);
  const ranked = useMemo(() => {
    const avail = Object.fromEntries(valueRows.map((r) => [r.id, r.avail]));
    const cmp = Object.fromEntries((data.seasons[cmpSeason] || []).map((p) => [p.id, p]));
    return proj.rows
      .map((p) => {
        const fpg = nbaPoints(p.stats, settings.scoring);
        const games = Math.round(gamesLeft * (avail[p.id] ?? 0.8));
        const now = data.players[p.id];
        return {
          ...p, position: now?.position || p.position, positions: now?.positions || p.positions, team: now?.team || p.team,
          fpg, games, total: fpg * games, lastFpg: cmp[p.id] ? nbaFpg(cmp[p.id], settings.scoring) : null,
        };
      })
      .sort(NBA_PROJ_SORTS.total)
      .map((r, i) => ({ ...r, projRank: i + 1 }));
  }, [proj.rows, valueRows, gamesLeft, data, cmpSeason, settings.scoring]);

  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    return ranked
      .filter((r) => nbaPosMatch(r, pos))
      .filter((r) => !q || r.name.toLowerCase().includes(q) || (r.team || "").toLowerCase() === q)
      .sort(NBA_PROJ_SORTS[sortBy]);
  }, [ranked, pos, query, sortBy]);

  const th = (label, align = "right") => (
    <th className={`text-${align} px-3 py-2 text-xs font-semibold sticky top-0 z-10`} style={{ color: "var(--text-muted)" }}>{label}</th>
  );

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Projected Rankings"
        lead={`Every player ranked by projected ${nbaSeasonLabel(season)} fantasy points in ${scoringLabel} scoring, with Sleeper's ADP to spot bargains.`}>
        Projections are Sleeper's per-game stat lines for the {nbaSeasonLabel(season)} season, scored in your league's
        settings. Projected points = projected FPG × the {gamesLeft} team games left × how often he's played (games played ÷
        team games, 50-100%, from this season once he's played 10 games, otherwise last season; 80% for players without
        NBA games). <strong>vs ADP</strong> compares his projected rank with where he goes in Sleeper drafts: green means
        he's projected to outscore his draft spot. {NBA_SCORING_NOTE[settings.scoring]}
      </NbaPageHeader>

      <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
        <LabeledControl label="Scoring">
          <PillGroup options={NBA_SETTING_OPTIONS.scoring} value={settings.scoring} accent="var(--hue-violet)"
            onChange={(v) => setSettings((s) => ({ ...s, scoring: v }))} />
        </LabeledControl>
        <LabeledControl label="Position">
          <PillGroup options={NBA_POSITION_OPTIONS} value={pos} onChange={setPos} />
        </LabeledControl>
        <input type="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search player or team"
          className="rounded-md border px-3 py-1.5 text-sm w-full sm:w-56 sm:ml-auto" style={inputStyle} />
      </div>

      {proj.status === "error" ? (
        <div className="rounded-lg border p-8 text-center text-sm" style={{ borderColor: "var(--border)", background: "var(--surface-1)", color: "var(--text-muted)" }}>
          Couldn't load projections from Sleeper ({proj.message}).
        </div>
      ) : (
        <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
          <table className="w-full border-collapse text-sm">
            <thead>
              <tr>
                {th("RK")}{th("Player", "left")}{th("Pos", "left")}
                <SortHeader label="Proj Pts" active={sortBy === "total"} onClick={() => setSortBy("total")} />
                <SortHeader label="Proj FPG" active={sortBy === "fpg"} onClick={() => setSortBy("fpg")} />
                {th("Games")}
                {th(`${nbaSeasonLabel(cmpSeason)} FPG`)}
                <SortHeader label="ADP" active={sortBy === "adp"} onClick={() => setSortBy("adp")} />
                {th("vs ADP")}
                {NBA_PER_GAME.map(([, h]) => <th key={h} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {proj.status === "loading" && (
                <tr><td colSpan={16} className="px-3 py-6 text-center" style={{ color: "var(--text-muted)" }}>Loading projections from Sleeper…</td></tr>
              )}
              {proj.status === "live" && rows.length === 0 && (
                <tr><td colSpan={16} className="px-3 py-6 text-center" style={{ color: "var(--text-muted)" }}>No matches.</td></tr>
              )}
              {rows.map((r, i) => {
                const diff = r.adp != null ? Math.round(r.adp) - r.projRank : null;
                const change = r.lastFpg != null ? r.fpg - r.lastFpg : null;
                return (
                  <tr key={r.id} className="border-b row-hover" style={{ borderColor: "var(--border)" }}>
                    <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{i + 1}</td>
                    <td className="px-3 py-1.5 whitespace-nowrap">
                      <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                      <span className="text-xs" style={{ color: "var(--text-muted)" }}>{r.team}</span>
                      <NbaInjuryTag status={data.players[r.id]?.status} />

const PLAYER_HASH = { nfl: "#/player/", nba: "#/nba/player/" };

const headshotUrl = (sport, id) => `https://sleepercdn.com/content/${sport}/players/thumb/${id}.jpg`;

// The id in a profile URL, kept in sync with back/forward and link clicks.
function usePlayerIdFromHash(sport) {
  const read = () => {
    const h = window.location.hash;
    return h.startsWith(PLAYER_HASH[sport]) ? decodeURIComponent(h.slice(PLAYER_HASH[sport].length)) : null;
  };
  const [id, setId] = useState(read);
  useEffect(() => {
    const sync = () => setId(read());
    window.addEventListener("hashchange", sync);
    window.addEventListener("popstate", sync);
    return () => { window.removeEventListener("hashchange", sync); window.removeEventListener("popstate", sync); };
  }, [sport]);
  return id;
}

// Football tabs carry three kinds of player id: Sleeper's own ("4984"),
// extras from the live scores ("sl-4984"), and this app's short ids for the
// shared player pool ("gibbs"). The short ones are matched to Sleeper by name
// and position, the same way the live scores and injury report match them.
function nflIdResolver(sleeperPlayers) {
  const S = window.SleeperScores;
  const byName = new Map();
  if (S) for (const id in sleeperPlayers) byName.set(`${S.normalizeName(sleeperPlayers[id].name)}|${sleeperPlayers[id].position}`, id);
  return (id, name, pos) => {
    if (!id) return null;
    id = String(id);
    if (/^\d+$/.test(id)) return id;
    if (id.startsWith("sl-")) return id.slice(3);
    if (!S) return null;
    return S.SLEEPER_ID_OVERRIDES[id] || byName.get(`${S.normalizeName(name)}|${pos}`) || null;
  };
}
const NflIdContext = React.createContext(nflIdResolver({}));

// A player's name as a link to his profile. Pass `name` and `pos` for
// football short ids so they can be matched; picks and anyone who can't be
// matched stay plain text.
function PlayerLink({ sport = "nfl", id, name, pos, children, className = "font-medium" }) {
  const resolve = React.useContext(NflIdContext);
  const target = pos === "PICK" ? null : sport === "nfl" ? resolve(id, name, pos) : id;
  if (!target) return <span className={className} style={{ color: "var(--text-primary)" }}>{children}</span>;
  return <a href={playerHash(sport, target)} className={`player-link ${className}`} onClick={() => window.scrollTo(0, 0)}>{children}</a>;
}

// Per-player Sleeper feeds, kept in memory for 10 minutes so flipping between
// profiles doesn't refetch. useFeeds re-checks on useRefreshTick.
const feedCache = new Map();
const FEED_TTL_MS = 10 * 60 * 1000;
function fetchFeed(url) {
  const hit = feedCache.get(url);
  if (hit && Date.now() - hit.at < FEED_TTL_MS) return hit.promise;
  const promise = fetch(url).then((r) => {
    if (!r.ok) throw new Error(`Sleeper request failed (${r.status})`);
    return r.json();
  });
  promise.catch(() => feedCache.delete(url));
  feedCache.set(url, { at: Date.now(), promise });
  return promise;
}

function useFeeds(urls) {
  const key = urls ? urls.join("|") : "";
  const tick = useRefreshTick();
  const [state, setState] = useState({ key: "", status: "loading", data: null });
  useEffect(() => {
    if (!urls) return;
    let cancelled = false;
    Promise.all(urls.map(fetchFeed))
      .then((data) => { if (!cancelled) setState({ key, status: "live", data }); })
      // A failed background refresh keeps what's on screen.
      .catch((err) => { if (!cancelled) setState((s) => (s.key === key && s.data ? s : { key, status: "error", message: err.message, data: null })); });
    return () => { cancelled = true; };
  }, [key, tick]);
  return state.key === key ? state : { status: "loading", data: null };
}

// Fantasy points per game (or week) as bars, with an optional projection
// tick on each and a dashed line at the average. Hovering a bar (or focusing
// it) fills the readout line underneath; it starts on the latest game.
// items: [{ key, label, actual, proj, detail }] — actual null = no game.
function PointsChart({ items, color, showProj }) {
  const played = items.filter((it) => it.actual != null);
  const avg = played.length ? played.reduce((t, it) => t + it.actual, 0) / played.length : null;
  const max = Math.max(1, ...items.map((it) => Math.max(it.actual || 0, showProj ? it.proj || 0 : 0)));
  const [hover, setHover] = useState(null);
  const latest = played[played.length - 1] || items[0];
  const shown = items.find((it) => it.key === hover) || latest;
  const pct = (v) => `${(v / max) * 100}%`;

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center gap-4 text-xs" style={{ color: "var(--text-secondary)" }}>
        <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-sm" style={{ background: color }} />Fantasy points</span>
        {showProj && <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-0.5" style={{ background: "var(--text-primary)" }} />Projected</span>}
        {avg != null && <span className="flex items-center gap-1.5"><span className="inline-block w-3 border-t border-dashed" style={{ borderColor: "var(--text-muted)" }} />Average {fmt1(avg)}</span>}
      </div>
      <div className="pts-chart" onMouseLeave={() => setHover(null)}>
        {avg != null && <div className="pts-avg" style={{ bottom: pct(avg) }} />}
        {items.map((it) => (
          <button key={it.key} type="button" className="pts-col" aria-label={`${it.label}: ${it.detail}`}
            onMouseEnter={() => setHover(it.key)} onFocus={() => setHover(it.key)} data-active={shown && shown.key === it.key}>
            {it.actual != null && <span className="pts-bar" style={{ height: pct(it.actual), background: color }} />}
            {showProj && it.proj != null && <span className="pts-proj" style={{ bottom: pct(it.proj) }} />}
            {it.actual == null && it.proj == null && <span className="pts-none">–</span>}
          </button>
        ))}
      </div>
      <div className="pts-labels">
        {items.map((it) => <span key={it.key}>{it.short || it.label}</span>)}

      {shown && (
        <p className="text-sm tabular-nums" style={{ color: "var(--text-secondary)" }}>
          <span className="font-semibold" style={{ color: "var(--text-primary)" }}>{shown.label}</span> · {shown.detail}

  );
}
