/* ---------------- sleeper trending (live) ---------------- */
// Unlike the hand-curated list above, this part IS live: Sleeper's API sends
// an open CORS header (unlike BeatADP), so a browser tab can call it
// directly — no refresh script or extension needed. Two endpoints:
// - /players/nfl/trending/add — which player IDs are being added across
//   Sleeper leagues right now, and how many times in the lookback window.
// - /players/nfl — every player Sleeper knows about, to turn those IDs into
//   names/teams/positions. Sleeper's own docs say this second one is a
//   large (~5MB+) payload meant to be cached and refreshed at most once a
//   day, not called per-request — so it's trimmed to skill positions
//   (QB/RB/WR/TE) and cached in localStorage before being reused.
const SLEEPER_PLAYERS_CACHE_KEY = "ff-valuediff:sleeper-players-cache";
const SLEEPER_PLAYERS_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
const SLEEPER_TRENDING_LOOKBACK_HOURS = 24;
const SLEEPER_TRENDING_LIMIT = 15;
const SKILL_POSITIONS = ["QB", "RB", "WR", "TE"];

async function fetchSleeperPlayerMap() {
  try {
    const cached = JSON.parse(localStorage.getItem(SLEEPER_PLAYERS_CACHE_KEY) || "null");
    if (cached && Date.now() - cached.fetchedAt < SLEEPER_PLAYERS_CACHE_TTL_MS) return cached.players;
  } catch (e) {}

  const res = await fetch("https://api.sleeper.app/v1/players/nfl");
  if (!res.ok) throw new Error(`Sleeper player lookup failed (${res.status})`);
  const all = await res.json();
  const trimmed = {};
  for (const id in all) {
    const p = all[id];
    if (p && SKILL_POSITIONS.includes(p.position) && p.team) {
      trimmed[id] = { name: p.full_name, position: p.position, team: p.team, status: p.injury_status || null };
    }
  }
  try {
    localStorage.setItem(SLEEPER_PLAYERS_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), players: trimmed }));
  } catch (e) {
    // Quota exceeded or storage unavailable — fine, this session just won't cache it.
  }
  return trimmed;
}

async function fetchSleeperTrending(direction) {
  const url = `https://api.sleeper.app/v1/players/nfl/trending/${direction}?lookback_hours=${SLEEPER_TRENDING_LOOKBACK_HOURS}&limit=${SLEEPER_TRENDING_LIMIT * 3}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Sleeper trending fetch failed (${res.status})`);
  return res.json();
}

function SleeperTrending() {
  const [direction, setDirection] = useState("add");
  const [state, setState] = useState({ status: "loading", rows: [] });

  useEffect(() => {
    let cancelled = false;
    setState({ status: "loading", rows: [] });

    Promise.all([fetchSleeperTrending(direction), fetchSleeperPlayerMap()])
      .then(([trending, playerMap]) => {
        if (cancelled) return;
        const rows = trending
          .map((t) => ({ ...playerMap[t.player_id], count: t.count }))
          // Trending includes D/STs and non-skill players too — that entry
          // just won't have matched anything in the trimmed player map.
          .filter((r) => r.name)
          .slice(0, SLEEPER_TRENDING_LIMIT);
        setState({ status: "ready", rows });
      })
      .catch((err) => {
        if (cancelled) return;
        setState({ status: "error", rows: [], message: err.message });
      });

    return () => { cancelled = true; };
  }, [direction]);

  return (
    <div className="rounded-lg border p-4" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
      <div className="flex items-center justify-between flex-wrap gap-2 mb-1">
        <h3 className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>
          Trending on Sleeper <span className="font-normal" style={{ color: "var(--text-muted)" }}>· live</span>
        </h3>
        <div className="flex items-center gap-1">
          {["add", "drop"].map((d) => (
            <button key={d} type="button" onClick={() => setDirection(d)}
              className="rounded-full px-2.5 py-1 text-xs font-medium border capitalize"
              style={{
                borderColor: "var(--border)",
                background: direction === d ? "var(--series-blue)" : "transparent",
                color: direction === d ? "#ffffff" : "var(--text-secondary)",
              }}>
              {d === "add" ? "Adds" : "Drops"}
            </button>
          ))}
        </div>
      </div>
      <p className="text-xs mb-3" style={{ color: "var(--text-muted)" }}>
        Real-time — how many Sleeper fantasy teams have {direction === "add" ? "added" : "dropped"} each player
        in the last {SLEEPER_TRENDING_LOOKBACK_HOURS}h, straight from Sleeper's public API. This is raw
        community activity, not a vetted pick — no reasoning behind why a name is moving, unlike the hand-curated
        list below.
      </p>

      {state.status === "loading" && (
        <p className="text-sm py-4 text-center" style={{ color: "var(--text-muted)" }}>Loading live data from Sleeper…</p>
      )}
      {state.status === "error" && (
        <p className="text-sm py-4 text-center" style={{ color: "var(--text-muted)" }}>
          Couldn't reach Sleeper's API ({state.message}). This needs the page served over http(s) with network
          access — it won't work from a plain double-clicked file.
        </p>
      )}
      {state.status === "ready" && (
        <div className="flex flex-wrap gap-2">
          {state.rows.map((r, i) => (
            <div key={i} className="rounded-md border px-2.5 py-1.5 text-xs flex items-center gap-2"
              style={{ borderColor: "var(--border)" }}>
              <span className="font-medium" style={{ color: "var(--text-primary)" }}>{r.name}</span>
              <span style={{ color: "var(--text-muted)" }}>{r.position} · {r.team}{r.status ? ` · ${r.status}` : ""}</span>
              <span className="tabular-nums font-semibold" style={{ color: direction === "add" ? "var(--series-blue)" : "var(--series-red)" }}>
                {r.count.toLocaleString()}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- weekly scores page ---------------- */
// Weeks with a real entry in WEEKLY_SCORES show actual results; every week
// 1-18 still gets a tab (unlike Waiver Wire's played-weeks-only tabs) since
// each week's bye list is known for the whole season in advance, even before
// that week's games have happened.
// Per-cell state for one player in one week of the season grid: a real
// score, that team's real bye week, or a week that hasn't been played yet —
// each renders differently (number / "BYE" / blank) rather than collapsing
// "no number" into one meaning.
function weekCell(player, w) {
  if (BYE_WEEKS[player.team] === w) return { type: "bye" };
  const wk = WEEKLY_SCORES[w];
  if (!wk || wk[player.id] === undefined) return { type: "blank" };
  return { type: "score", value: wk[player.id] };
}

// Modeled on FantasyPros' own "Weekly Fantasy Football Leaders" report
// (RK / Player / POS / GP / Wk1…Wk18 / AVG / TTL, sortable by AVG or TTL) —
// same shape, backed by this app's own real-results-only WEEKLY_SCORES.
function SortHeader({ label, active, onClick }) {
  return (
    <th className="text-right px-3 py-2 text-xs font-semibold sticky top-0 z-20 select-none cursor-pointer"
      onClick={onClick}
      style={{ color: active ? "var(--text-primary)" : "var(--text-muted)", background: "var(--surface-1)" }}>
      {label} {active && <span style={{ color: "var(--series-blue)" }}>▾</span>}
    </th>
  );
}

function SeasonGrid({ players, positionFilter }) {
  const [sortBy, setSortBy] = useState("ttl");

  const rows = useMemo(() => {
    const withTotals = players
      .filter((p) => positionFilter === "ALL" || p.position === positionFilter)
      .map((p) => {
        const cells = ALL_WEEKS.map((w) => weekCell(p, w));
        const gp = cells.filter((c) => c.type === "score").length;
        const ttl = cells.reduce((sum, c) => sum + (c.type === "score" ? c.value : 0), 0);
        const avg = gp > 0 ? ttl / gp : null;
        return { ...p, cells, gp, ttl, avg };
      });
    return withTotals.sort((a, b) => {
      if (sortBy === "avg") return (b.avg ?? -1) - (a.avg ?? -1);
      return b.ttl - a.ttl;
    });
  }, [players, positionFilter, sortBy]);

  return (
    <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
      <table className="border-collapse text-sm" style={{ minWidth: "100%" }}>
        <thead>
          <tr style={{ borderBottom: "1px solid var(--border)" }}>
            <th className="text-right px-2 py-2 text-xs font-semibold sticky top-0 left-0 z-20"
              style={{ color: "var(--text-muted)", background: "var(--surface-1)" }}>RK</th>
            <th className="text-left px-3 py-2 text-xs font-semibold sticky top-0 z-20"
              style={{ color: "var(--text-muted)", background: "var(--surface-1)", left: "2.5rem" }}>Player</th>
            <th className="text-left px-2 py-2 text-xs font-semibold sticky top-0 z-10"
              style={{ color: "var(--text-muted)", background: "var(--surface-1)" }}>Pos</th>
            <th className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10"
              style={{ color: "var(--text-muted)", background: "var(--surface-1)" }}>GP</th>
            {ALL_WEEKS.map((w) => (
              <th key={w} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10"
                style={{ color: "var(--text-muted)", background: "var(--surface-1)", minWidth: "2.75rem" }}>
                {w}
              </th>
            ))}
            <SortHeader label="TTL" active={sortBy === "ttl"} onClick={() => setSortBy("ttl")} />
            <SortHeader label="AVG" active={sortBy === "avg"} onClick={() => setSortBy("avg")} />
          </tr>
        </thead>
        <tbody>
          {rows.map((p, i) => {
            const rowBg = i % 2 === 1 ? "var(--page)" : "var(--surface-1)";
            return (
              <tr key={p.id} className="border-b" style={{ borderColor: "var(--border)", background: rowBg }}>
                <td className="px-2 py-1.5 text-right tabular-nums sticky left-0"
                  style={{ color: "var(--text-muted)", background: rowBg }}>{i + 1}</td>
                <td className="px-3 py-1.5 whitespace-nowrap sticky z-0" style={{ background: rowBg, left: "2.5rem" }}>
                  <span className="font-medium" style={{ color: "var(--text-primary)" }}>{p.name}</span>{" "}
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>{p.team}</span>
                </td>
                <td className="px-2 py-1.5" style={{ color: "var(--text-secondary)" }}>{p.position}</td>
                <td className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{p.gp}</td>
                {p.cells.map((c, wi) => (
                  <td key={wi} className="px-2 py-1.5 text-right tabular-nums"
                    style={{ color: c.type === "score" ? "var(--text-primary)" : "var(--text-muted)" }}>
                    {c.type === "score" ? c.value.toFixed(1) : c.type === "bye" ? "BYE" : "–"}

                ))}

                  {p.avg === null ? "–" : p.avg.toFixed(1)}
                </td>
              </tr>
            );

const WEEKLY_VIEWS = [
  { key: "byWeek", label: "By Week" },
  { key: "grid", label: "Season Grid" },
];

// RB/WR ahead of QB/TE, ALL last rather than first — matches how this app's
// audience actually scans a position filter (skill positions people are
// picking waivers/streamers for first, the full unfiltered view last).
const POSITIONS = ["RB", "WR", "QB", "TE", "ALL"];

function WeeklyScores({ players }) {
  const [view, setView] = useState("byWeek");
  const [week, setWeek] = useState(1);
  const [positionFilter, setPositionFilter] = useState("RB");

  const scores = WEEKLY_SCORES[week];
  const byeTeams = useMemo(
    () => Object.keys(BYE_WEEKS).filter((team) => BYE_WEEKS[team] === week).sort(),
    [week]
  );

  const ranked = useMemo(() => {
    if (!scores) return [];
    return players
      .filter((p) => positionFilter === "ALL" || p.position === positionFilter)
      .filter((p) => !byeTeams.includes(p.team))
      .map((p) => ({ ...p, points: scores[p.id] ?? null }))
      .filter((p) => p.points !== null)
      .sort((a, b) => b.points - a.points);
  }, [players, scores, positionFilter, byeTeams]);

  const onBye = useMemo(
    () => players.filter((p) => byeTeams.includes(p.team)),
    [players, byeTeams]
  );

  return (
    <div className="flex flex-col gap-5">
      <header>
        <h2 className="text-lg font-semibold" style={{ color: "var(--text-primary)" }}>Weekly Scores</h2>
        <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>
          Every player in the database, by actual PPR fantasy points — one week at a time, or as a full
          Week 1-18 season grid with a running total.
        </p>
        <p className="text-xs mt-1" style={{ color: "var(--text-muted)" }}>
          Real Weeks 1-2 results as of {WEEKLY_SCORES_UPDATED_ON} (FantasyPros' Week 1/2 2026 stats tables). Weeks
          3-18 haven't been played yet, so nothing fabricated is shown for them — only <code>WEEKLY_SCORES</code>{" "}
          entries that actually exist are rendered as results; add a week's key in <code>index.html</code> once
          it's actually been played. Bye weeks are the real 2026 schedule and show up regardless of whether
          that week's scores are in yet — "BYE" in the grid, or the bye list below in the by-week view.
        </p>
      </header>

      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-1">
          {WEEKLY_VIEWS.map((v) => (
            <button key={v.key} type="button" onClick={() => setView(v.key)}
              className="rounded-full px-3 py-1 text-xs font-medium border"
              style={{
                borderColor: "var(--border)",
                background: view === v.key ? "var(--series-neutral)" : "transparent",
                color: view === v.key ? "var(--surface-1)" : "var(--text-secondary)",
              }}>
              {v.label}
            </button>
          ))}
        </div>
        <div className="flex items-center gap-1">
          {POSITIONS.map((pos) => (
            <button key={pos} type="button" onClick={() => setPositionFilter(pos)}
              className="rounded-full px-3 py-1 text-xs font-medium border"
              style={{
                borderColor: "var(--border)",
                background: positionFilter === pos ? "var(--series-blue)" : "transparent",
                color: positionFilter === pos ? "#ffffff" : "var(--text-secondary)",
              }}>
              {pos}
            </button>
          ))}
        </div>
      </div>

      {view === "grid" ? (
        <SeasonGrid players={players} positionFilter={positionFilter} />
      ) : (
        <>
          <div className="flex items-center gap-1 flex-wrap">
            {PLAYED_WEEKS.map((w) => (
              <button key={w} type="button" onClick={() => setWeek(w)}
                className="rounded-full px-3 py-1 text-xs font-medium border"
                style={{
                  borderColor: "var(--border)",
                  background: week === w ? "var(--series-blue)" : "transparent",
                  color: week === w ? "#ffffff" : (WEEKLY_SCORES[w] ? "var(--text-secondary)" : "var(--text-muted)"),
                }}>
                Wk {w}
              </button>
            ))}
          </div>

          <div className="rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
            <span className="font-medium" style={{ color: "var(--text-primary)" }}>Byes, Week {week}: </span>
            {byeTeams.length === 0 ? (
              <span style={{ color: "var(--text-muted)" }}>none — every team plays this week.</span>
            ) : (
              <span style={{ color: "var(--text-secondary)" }}>{byeTeams.join(", ")}</span>
            )}
          </div>

          {!scores ? (
            <div className="rounded-lg border p-8 text-center text-sm" style={{ borderColor: "var(--border)", color: "var(--text-muted)" }}>
              Week {week} hasn't been played yet, so there are no real scores to show. Check the bye list above —
              that part of the season is already fixed regardless of what's happened on the field.
            </div>
          ) : (
            <div className="rounded-lg border overflow-x-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
              <table className="w-full border-collapse text-sm">
                <thead>
                  <tr style={{ borderBottom: "1px solid var(--border)" }}>
                    <th className="text-right px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>#</th>
                    <th className="text-left px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>Player</th>
                    <th className="text-left px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>Pos</th>
                    <th className="text-left px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>Team</th>
                    <th className="text-right px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>FPTS</th>
                  </tr>
                </thead>
                <tbody>
                  {ranked.map((p, i) => (
                    <tr key={p.id} className="border-b" style={{ borderColor: "var(--border)" }}>
                      <td className="px-3 py-2 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{i + 1}</td>
                      <td className="px-3 py-2 font-medium" style={{ color: "var(--text-primary)" }}>{p.name}</td>
                      <td className="px-3 py-2" style={{ color: "var(--text-secondary)" }}>{p.position}</td>
                      <td className="px-3 py-2" style={{ color: "var(--text-secondary)" }}>{p.team}</td>
                      <td className="px-3 py-2 text-right font-semibold tabular-nums" style={{ color: "var(--text-primary)" }}>
                        {p.points.toFixed(1)}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {scores && onBye.length > 0 && (
            <div>
              <h3 className="text-sm font-semibold mb-1" style={{ color: "var(--text-primary)" }}>On bye this week</h3>
              <div className="flex flex-wrap gap-1.5">
                {onBye
                  .filter((p) => positionFilter === "ALL" || p.position === positionFilter)
                  .map((p) => (
                    <span key={p.id} className="rounded-full border px-2.5 py-1 text-xs"
                      style={{ borderColor: "var(--border)", color: "var(--text-muted)" }}>
                      {p.name} <span style={{ color: "var(--text-muted)" }}>({p.team})</span>
                    </span>
                  ))}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

const PROP_SITES = [
  { key: "sleeper", label: "Sleeper" },
  { key: "espn", label: "ESPN" },
];

// PPR, 4-point passing TDs, -2 per INT (ESPN's default; Sleeper's own
// projections use -1). Fumbles have no line, so they aren't counted.
const PPR = { rec: 1, recYd: 0.1, rushYd: 0.1, passYd: 0.04, passTd: 4, int: -2, td: 6 };
// Rough standard deviation of each stat, used only to nudge a juiced line's
// mean off the line itself (a 6.5-reception line at -154/+116 means the
// market expects closer to 7 catches, not 6.5).
const PROP_SD = { recs: (l) => Math.sqrt(l) * 1.1, yds: (l) => Math.max(15, l * 0.45), passYds: () => 55 };
// Anytime-TD prices are one-sided (no "no TD" price to de-vig against), so
// they're scaled down by a flat hold estimate instead.
const ATTD_HOLD = 0.92;

function impliedProb(odds) {
  return odds < 0 ? -odds / (-odds + 100) : 100 / (odds + 100);
}

// No-vig probability of the over, or null if either side is unknown.
function noVigOver([, over, under]) {
  if (over == null || under == null) return null;
  const po = impliedProb(over), pu = impliedProb(under);
  return po / (po + pu);
}

// Inverse standard normal CDF (Acklam's rational approximation).
function normInv(p) {
  const a = [-39.6968302866538, 220.946098424521, -275.928510446969, 138.357751867269, -30.6647980661472, 2.50662827745924];
  const b = [-54.4760987982241, 161.585836858041, -155.698979859887, 66.8013118877197, -13.2806815528857];
  const c = [-0.00778489400243029, -0.322396458041136, -2.40076144775900, -2.54973253934373, 4.37466414146497, 2.93816398269878];
  const d = [0.00778469570904146, 0.322467129070040, 2.44513413714300, 3.75440866190143];
  if (p < 0.02425) {
    const q = Math.sqrt(-2 * Math.log(p));
    return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
  }
  if (p > 1 - 0.02425) return -normInv(1 - p);
  const q = p - 0.5, r = q * q;
  return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q /
    (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
}

// Market-implied mean for an over/under line: the line itself, shifted by
// however far the no-vig over probability is from 50/50.
function impliedMean(lineArr, sdFn) {
  const [line] = lineArr;
  const p = noVigOver(lineArr);
  if (p == null) return line;
  return Math.max(0, line + sdFn(line) * normInv(p));
}

// Expected count for a Poisson stat (passing TDs, INTs): the mean whose
// P(X > line) matches the no-vig over price (e.g. passing TDs over 1.5 at
// -150 → ~2.1 expected).
function impliedPoissonMean(lineArr) {
  const [line] = lineArr;
  const p = noVigOver(lineArr) ?? 0.5;
  const k = Math.floor(line);
  const pOver = (lam) => {
    let term = Math.exp(-lam), cdf = term;
    for (let i = 1; i <= k; i++) { term *= lam / i; cdf += term; }
    return 1 - cdf;
  };
  let lo = 0, hi = 10;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    if (pOver(mid) < p) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

// Which lines each position needs for a complete implied total.
const PROP_NEEDS = {
  QB: [["passYds", "pass yds"], ["passTds", "pass TD"], ["rushYds", "rush yds"], ["tdOdds", "rush TD"]],
  RB: [["rushYds", "rush yds"], ["recs", "receptions"], ["recYds|rushRecYds", "rec yds"], ["tdOdds", "TD"]],
  WR: [["recs", "receptions"], ["recYds", "rec yds"], ["tdOdds", "TD"]],
  TE: [["recs", "receptions"], ["recYds", "rec yds"], ["tdOdds", "TD"]],
};

// Turns one WEEK_PROPS entry into implied PPR points plus a breakdown, and
// lists which inputs had no line (so a low number caused by a missing line
// reads as incomplete, not as a fade).
function propsImpliedPoints(prop, position) {
  const parts = [];
  let pts = 0;
  const add = (label, value, mult) => { pts += value * mult; parts.push(`${label} ${value.toFixed(1)}`); };

  if (prop.passYds) add("pass yds", impliedMean(prop.passYds, PROP_SD.passYds), PPR.passYd);
  if (prop.passTds) add("pass TD", impliedPoissonMean(prop.passTds), PPR.passTd);
  if (prop.ints) add("INT", impliedPoissonMean(prop.ints), PPR.int);
  if (prop.rushYds) add("rush yds", impliedMean(prop.rushYds, PROP_SD.yds), PPR.rushYd);
  if (prop.recs) add("rec", impliedMean(prop.recs, PROP_SD.recs), PPR.rec);
  if (prop.recYds) add("rec yds", impliedMean(prop.recYds, PROP_SD.yds), PPR.recYd);
  else if (prop.rushRecYds && prop.rushYds) {
    const recYds = Math.max(0, impliedMean(prop.rushRecYds, PROP_SD.yds) - impliedMean(prop.rushYds, PROP_SD.yds));
    add("rec yds", recYds, PPR.recYd);
  }
  if (prop.tdOdds != null) {
    const p = impliedProb(prop.tdOdds) * ATTD_HOLD;
    add("TDs", -Math.log(1 - p), PPR.td);
  }

  const missing = (PROP_NEEDS[position] || [])
    .filter(([fields]) => !fields.split("|").some((f) => prop[f] != null))
    .map(([, label]) => label);
  return { pts, parts, missing };
}

// A player with only an anytime-TD price (their game's yardage lines aren't
// posted yet) has nothing to compare, so they're left out of the table.
function hasStatLines(prop) {
  return ["passYds", "passTds", "rushYds", "recs", "recYds", "rushRecYds"].some((f) => prop[f] != null);
}

// Same idea as the refresh script's matching: "Kenneth Walker III" and
// "Kenneth Walker" are the same player.
function projKey(name) {
  return String(name || "")
    .replace(/\b(jr|sr|ii|iii|iv|v)\.?$/i, "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]/g, "");
}

const PROPS_SEASON = Number(PROPS_UPDATED_ON.slice(0, 4));

async function fetchSleeperProjections(season, week) {
  const pos = SKILL_POSITIONS.map((p) => `position[]=${p}`).join("&");
  const res = await fetch(`https://api.sleeper.com/projections/nfl/${season}/${week}?season_type=regular&${pos}`);
  if (!res.ok) throw new Error(`Sleeper projections failed (${res.status})`);
  const out = {};
  for (const row of await res.json()) {
    const p = row.player;
    const pts = row.stats && row.stats.pts_ppr;
    if (!p || pts == null) continue;
    // Keyed by name+team first, so two same-named players don't collide;
    // the name-only key covers a team mismatch (e.g. a recent trade).
    const k = projKey(`${p.first_name} ${p.last_name}`);
    out[`${k}|${p.team}`] = pts;
    if (!(k in out)) out[k] = pts;
  }
  return out;
}

// ESPN's default PPR league (leaguedefaults/3) returns each player's
// projection for the requested week as a stat line with statSourceId 1.
async function fetchEspnProjections(season, week) {
  const filter = { players: { limit: 1000, filterSlotIds: { value: [0, 2, 4, 6] }, sortPercOwned: { sortPriority: 1, sortAsc: false } } };
  const res = await fetch(
    `https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/${season}/segments/0/leaguedefaults/3?view=kona_player_info&scoringPeriodId=${week}`,
    { headers: { "X-Fantasy-Filter": JSON.stringify(filter) } }
  );
  if (!res.ok) throw new Error(`ESPN projections failed (${res.status})`);
  const out = {};
  for (const { player } of (await res.json()).players || []) {
    const stat = (player.stats || []).find((s) => s.seasonId === season && s.scoringPeriodId === week && s.statSourceId === 1);
    if (stat) out[projKey(player.fullName)] = stat.appliedTotal;
  }
  return out;
}

function useSiteProjections(season, week) {
  const [state, setState] = useState({ sleeper: { status: "loading" }, espn: { status: "loading" } });
  useEffect(() => {
    let cancelled = false;
    const load = (key, fn) =>
      fn(season, week)
        .then((data) => !cancelled && setState((s) => ({ ...s, [key]: { status: "ok", data } })))
        .catch((err) => !cancelled && setState((s) => ({ ...s, [key]: { status: "error", error: err.message } })));
    load("sleeper", fetchSleeperProjections);
    load("espn", fetchEspnProjections);
    return () => { cancelled = true; };
  }, [season, week]);
  return state;
}

function lookupProjection(site, player) {
  if (site.status !== "ok") return null;
  const k = projKey(player.name);
  const v = site.data[`${k}|${player.team}`] ?? site.data[k];
  return v != null ? v : null;
}

function fmtOdds(n) {
  if (n == null) return "–";
  return n > 0 ? `+${n}` : `${n}`;
}

function fmtLine(label, arr) {
  if (!arr) return null;
  const [line, over, under] = arr;
  const odds = over != null ? ` (${fmtOdds(over)}${under != null ? `/${fmtOdds(under)}` : ""})` : "";
  return `${label} ${line}${odds}`;
}

function fmtDiff(n) {
  if (n == null) return "–";
  return `${n > 0 ? "+" : ""}${n.toFixed(1)}`;
}

// Same math as SeasonGrid's AVG column (recent points per game from real
// WEEKLY_SCORES results only) — kept as its own small helper here rather
// than importing SeasonGrid's internal state, since this only needs the
// number, not the full week-by-week cell grid.
function recentAvgPoints(player) {
  const scored = PLAYED_WEEKS.map((w) => weekCell(player, w)).filter((c) => c.type === "score");
  const gp = scored.length;
  return { gp, avg: gp > 0 ? scored.reduce((sum, c) => sum + c.value, 0) / gp : null };
}

function PropsComparison({ players }) {
  const [sortBy, setSortBy] = useState("diff");
  const [sortDesc, setSortDesc] = useState(true);
  const [position, setPosition] = useState(POSITIONS[0]);
  const sites = useSiteProjections(PROPS_SEASON, PROPS_WEEK);

  function toggleSort(key) {
    if (key === sortBy) setSortDesc((d) => !d);
    else { setSortBy(key); setSortDesc(true); }
  }

  const byId = useMemo(() => Object.fromEntries(players.map((p) => [p.id, p])), [players]);
  const tdOnlyCount = useMemo(() => WEEK_PROPS.filter((p) => byId[p.id] && !hasStatLines(p)).length, [byId]);

  const rows = useMemo(() => {
    return WEEK_PROPS
      .filter(hasStatLines)
      .map((prop) => {
        const p = byId[prop.id];
        if (!p) return null;
        const { pts, parts, missing } = propsImpliedPoints(prop, p.position);
        const proj = Object.fromEntries(PROP_SITES.map((s) => [s.key, lookupProjection(sites[s.key], p)]));
        const vals = Object.values(proj).filter((v) => v != null);
        const site = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
        return {
          ...prop, ...p, ...recentAvgPoints(p),
          implied: pts, parts, missing, proj, site,
          diff: site != null ? pts - site : null,
        };
      })
      .filter((r) => r && (position === "ALL" || r.position === position))
      .sort((a, b) => {
        // An incomplete implied total skews its Diff low, so when sorting by
        // Diff, rows with every line present rank ahead of partial ones.
        if (sortBy === "diff" && (a.missing.length > 0) !== (b.missing.length > 0)) return a.missing.length > 0 ? 1 : -1;
        const cmp = (a[sortBy] ?? -999) - (b[sortBy] ?? -999);
        return sortDesc ? -cmp : cmp;
      });
  }, [byId, sites, sortBy, sortDesc, position]);

  function headerButton(key, label) {
    const active = sortBy === key;
    return (
      <button type="button" onClick={() => toggleSort(key)} className="flex items-center gap-1 text-xs font-semibold ml-auto"
        style={{ color: active ? "var(--text-primary)" : "var(--text-muted)" }}>
        {label}{active && <span>{sortDesc ? "↓" : "↑"}</span>}
      </button>
    );
  }

  const thMuted = { color: "var(--text-muted)" };
  const siteStatus = PROP_SITES.map((s) => {
    const st = sites[s.key];
    return st.status === "loading" ? `${s.label}: loading…` : st.status === "error" ? `${s.label}: unavailable (${st.error})` : null;
  }).filter(Boolean);

  return (
    <div className="flex flex-col gap-5">
      <header>
        <h2 className="text-lg font-semibold" style={{ color: "var(--text-primary)" }}>Props vs. Fantasy Projections</h2>
        <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>
          Week {PROPS_WEEK} sportsbook lines (yards, receptions, passing TDs, INTs, anytime TD) turned into the PPR
          points they imply, next to what Sleeper and ESPN project. <b>Diff</b> is props-implied minus the site
          average: positive means the betting market expects more than the fantasy sites do, negative means less.
        </p>
        <p className="text-xs mt-1" style={{ color: "var(--text-muted)" }}>
          Lines last refreshed {PROPS_UPDATED_ON} from RotoWire's props board (median line across books) — run{" "}
          <code>node scripts/refresh-props.js</code> to update; books post lines game by game through the week.
          Sleeper and ESPN projections load live. Scoring: 1 per catch, 0.1 per rushing/receiving yard, 0.04 per
          passing yard, 4 per passing TD, −2 per INT, 6 per other TD. Each over/under is shifted off its line by how
          juiced the over is; anytime-TD odds become expected TDs after trimming an estimated 8% hold. Rows missing
          a line are marked and their Diff greyed out, since the implied total is understated.
        </p>
        {siteStatus.length > 0 && (
          <p className="text-xs mt-1" style={{ color: "var(--series-amber)" }}>{siteStatus.join(" · ")}</p>
        )}
      </header>

      <div className="flex flex-wrap gap-1">
        {POSITIONS.map((pos) => (
          <button key={pos} type="button" onClick={() => setPosition(pos)}
            className="px-3 py-1 rounded-md text-xs font-semibold border"
            style={{
              borderColor: "var(--border)",
              background: position === pos ? "var(--text-primary)" : "var(--surface-1)",
              color: position === pos ? "var(--surface-1)" : "var(--text-secondary)",
            }}>
            {pos}
          </button>
        ))}
      </div>

      {rows.length === 0 ? (
        <div className="rounded-lg border p-8 text-center text-sm" style={{ borderColor: "var(--border)", color: "var(--text-muted)" }}>
          No stat lines in <code>WEEK_PROPS</code> for this filter yet — run <code>node scripts/refresh-props.js</code>{" "}
          once books have posted this week's lines.
        </div>
      ) : (
        <div className="rounded-lg border overflow-x-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
          <table className="w-full border-collapse text-sm">
            <thead>
              <tr style={{ borderBottom: "1px solid var(--border)" }}>
                <th className="text-left px-3 py-2 text-xs font-semibold" style={thMuted}>Player</th>
                <th className="text-left px-3 py-2 text-xs font-semibold" style={thMuted}>Lines</th>
                <th className="px-3 py-2 text-right">{headerButton("implied", "Props pts")}</th>
                {PROP_SITES.map((s) => (
                  <th key={s.key} className="text-right px-2 py-2 text-xs font-semibold" style={thMuted}>{s.label}</th>
                ))}
                <th className="px-3 py-2 text-right">{headerButton("diff", "Diff")}</th>
                <th className="px-3 py-2 text-right">{headerButton("avg", "Recent Avg")}</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => {
                const lines = [
                  fmtLine("Pass yds", r.passYds), fmtLine("Pass TD", r.passTds), fmtLine("INT", r.ints),
                  fmtLine("Rush yds", r.rushYds), fmtLine("Rush+rec yds", r.rushRecYds), fmtLine("Rec", r.recs),
                  fmtLine("Rec yds", r.recYds), r.tdOdds != null ? `Anytime TD ${fmtOdds(r.tdOdds)}` : null,
                ].filter(Boolean);
                const diffColor = r.diff == null || r.missing.length > 0 ? "var(--text-muted)"
                  : r.diff >= 1 ? "var(--series-blue)" : r.diff <= -1 ? "var(--series-red)" : "var(--text-secondary)";
                return (
                  <tr key={r.id} className="border-b align-top" style={{ borderColor: "var(--border)" }}>
                    <td className="px-3 py-1.5">
                      <div className="font-medium" style={{ color: "var(--text-primary)" }}>{r.name}</div>
                      <div className="text-xs" style={{ color: "var(--text-muted)" }}>{r.position} · {r.team}</div>
                    </td>
                    <td className="px-3 py-1.5 text-xs" style={{ color: "var(--text-secondary)" }}>
                      {lines.map((l) => <div key={l}>{l}</div>)}
                      {r.missing.length > 0 && (
                        <div className="mt-0.5" style={{ color: "var(--series-amber)" }}>No line: {r.missing.join(", ")}</div>
                      )}
                    </td>
                    <td className="px-3 py-1.5 text-right tabular-nums" title={r.parts.join(" · ")}>
                      <span className="font-semibold" style={{ color: "var(--text-primary)" }}>{r.implied.toFixed(1)}</span>
                      {r.missing.length > 0 && <span style={{ color: "var(--series-amber)" }}>*</span>}
                    </td>
                    {PROP_SITES.map((s) => (
                      <td key={s.key} className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>
                        {r.proj[s.key] != null ? r.proj[s.key].toFixed(1) : "–"}
                      </td>
                    ))}
                    <td className="px-3 py-1.5 text-right tabular-nums font-semibold" style={{ color: diffColor }}>
                      {fmtDiff(r.diff)}
                    </td>
                    <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>
                      {r.avg != null ? r.avg.toFixed(1) : "–"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      <p className="text-xs" style={{ color: "var(--text-muted)" }}>
        * Implied total is missing at least one stat line, so its Diff is greyed out and sorted after complete rows.
        Hover a Props pts value for its breakdown.
        {tdOnlyCount > 0 && ` ${tdOnlyCount} more players in the pool only have an anytime-TD price so far (their games' yardage lines aren't posted yet) and are left out until the next refresh.`}
      </p>
    </div>
  );
}

            style={{
              borderColor: page === p.key ? "var(--series-blue)" : "transparent",
              color: page === p.key ? "var(--text-primary)" : "var(--text-muted)",
            }}>
            {p.label}
          </button>
        ))}
      </nav>

      {page === "weekly" && <WeeklyScores players={players} />}
      {page === "waivers" && <WaiverTargets />}
      {page === "props" && <PropsComparison players={players} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
